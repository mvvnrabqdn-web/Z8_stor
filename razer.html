<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مولد الخصومات التلقائي - عروض متجددة</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            padding: 20px;
            direction: rtl;
            color: white;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            border-radius: 25px;
            padding: 30px;
            text-align: center;
            margin-bottom: 25px;
            box-shadow: 0 15px 40px rgba(255, 65, 108, 0.4);
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .auto-badge {
            display: inline-block;
            background: #00ff88;
            color: #000;
            padding: 8px 20px;
            border-radius: 30px;
            font-weight: bold;
            animation: blink 1.5s infinite;
            margin: 10px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 25px;
        }

        .btn {
            padding: 14px 28px;
            border-radius: 30px;
            border: none;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            color: white;
        }

        .btn-generate {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            box-shadow: 0 10px 30px rgba(245, 87, 108, 0.4);
        }

        .btn-generate:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(245, 87, 108, 0.6);
        }

        .btn-refresh {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            box-shadow: 0 10px 30px rgba(0, 242, 254, 0.4);
        }

        .btn-refresh:hover {
            transform: translateY(-3px);
        }

        .btn-super {
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            color: #000;
            font-size: 1.3em;
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.5);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .deals-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .deal-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            transition: all 0.4s;
            position: relative;
            overflow: hidden;
        }

        .deal-card:hover {
            transform: translateY(-8px);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .discount-circle {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8em;
            font-weight: bold;
            margin: 0 auto 15px;
            position: relative;
        }

        .discount-high {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            box-shadow: 0 0 30px rgba(255, 65, 108, 0.6);
        }

        .discount-medium {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            box-shadow: 0 0 30px rgba(245, 87, 108, 0.4);
        }

        .discount-low {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.4);
        }

        .deal-icon {
            font-size: 3em;
            text-align: center;
            margin-bottom: 10px;
        }

        .deal-title {
            font-size: 1.3em;
            font-weight: bold;
            text-align: center;
            margin-bottom: 10px;
            color: #fff;
        }

        .deal-store {
            text-align: center;
            color: #aaa;
            margin-bottom: 15px;
            font-size: 0.9em;
        }

        .deal-price {
            text-align: center;
            margin: 15px 0;
        }

        .old-price {
            text-decoration: line-through;
            color: #ff4444;
            font-size: 1.1em;
        }

        .new-price {
            color: #00ff88;
            font-size: 1.6em;
            font-weight: bold;
            margin: 0 10px;
        }

        .timer {
            text-align: center;
            color: #ffaa00;
            font-size: 0.9em;
            margin-top: 10px;
        }

        .get-deal-btn {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #00b4db, #0083b0);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 15px;
            font-size: 1.1em;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s;
            text-align: center;
        }

        .get-deal-btn:hover {
            background: linear-gradient(135deg, #00c6fb, #005bea);
            transform: scale(1.05);
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin: 20px 0;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px 25px;
            border-radius: 15px;
            text-align: center;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #ffd700;
        }

        .notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #00ff88;
            color: #000;
            padding: 15px 30px;
            border-radius: 30px;
            font-weight: bold;
            z-index: 1000;
            animation: slideDown 0.5s;
            box-shadow: 0 10px 30px rgba(0, 255, 136, 0.4);
        }

        @keyframes slideDown {
            from { top: -100px; opacity: 0; }
            to { top: 20px; opacity: 1; }
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }

        .particle {
            position: absolute;
            font-size: 2em;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    
    <div class="container">
        <div class="header">
            <h1>🎰 مولد الخصومات التلقائي</h1>
            <p>خصومات عشوائية تتجدد تلقائياً - اضغط الزر وشوف حظك!</p>
            <span class="auto-badge">⚡ تجديد تلقائي كل 30 ثانية</span>
        </div>

        <div class="controls">
            <button class="btn btn-generate" onclick="generateDeals()">🎲 ولّد خصومات جديدة</button>
            <button class="btn btn-super" onclick="generateSuperDeals()">💎 ولّد خصومات خارقة (حتى 100%)</button>
            <button class="btn btn-refresh" onclick="refreshSingleDeal()">🔄 جدد خصم واحد</button>
        </div>

        <div class="stats">
            <div class="stat-item">
                <div>🎯 عدد العروض</div>
                <div class="stat-value" id="dealCount">12</div>
            </div>
            <div class="stat-item">
                <div>🔥 أعلى خصم</div>
                <div class="stat-value" id="highestDiscount">87%</div>
            </div>
            <div class="stat-item">
                <div>⭐ متوسط الخصم</div>
                <div class="stat-value" id="avgDiscount">45%</div>
            </div>
        </div>

        <div class="deals-grid" id="dealsGrid"></div>
    </div>

    <script>
        // ========== قاعدة البيانات للمنتجات ==========
        const productsDB = [
            // ألعاب مشهورة
            { name: "فري فاير - شحن جواهر", store: "متجر فري فاير", icon: "🔥", basePrice: 20 },
            { name: "ببجي موبايل - شحن UC", store: "متجر ببجي", icon: "🎯", basePrice: 50 },
            { name: "روبلوكس - روبوكس", store: "روبلوكس", icon: "⭐", basePrice: 30 },
            { name: "فورتنايت - V-Bucks", store: "إيبيك قيمز", icon: "🎮", basePrice: 40 },
            { name: "كلاش أوف كلانس - جواهر", store: "سوبر سيل", icon: "💎", basePrice: 100 },
            { name: "جينشين إمباكت - كريستالات", store: "ميهويو", icon: "✨", basePrice: 100 },
            { name: "كول أوف ديوتي موبايل", store: "أكتيفجن", icon: "🎖️", basePrice: 60 },
            { name: "ماين كرافت", store: "موجانق", icon: "⛏️", basePrice: 30 },
            { name: "أمونغ آس", store: "ستيم", icon: "🚀", basePrice: 5 },
            { name: "فالورانت - نقاط", store: "رايوت", icon: "💣", basePrice: 50 },
            
            // بلايستيشن
            { name: "بلايستيشن بلس - سنة", store: "بلايستيشن", icon: "🎮", basePrice: 60 },
            { name: "بلايستيشن ستور كارد 100$", store: "أمازون", icon: "💳", basePrice: 100 },
            { name: "God of War Ragnarök", store: "بلايستيشن", icon: "⚔️", basePrice: 70 },
            { name: "Spider-Man 2", store: "بلايستيشن", icon: "🕷️", basePrice: 70 },
            
            // إكس بوكس
            { name: "قيم باس التيمت - 3 شهور", store: "مايكروسوفت", icon: "🎮", basePrice: 45 },
            { name: "إكس بوكس لايف قولد - سنة", store: "إكس بوكس", icon: "⭐", basePrice: 60 },
            { name: "Forza Horizon 5", store: "إكس بوكس", icon: "🏎️", basePrice: 60 },
            
            // تيكسي بلي
            { name: "تيكسي بلي - باقة VIP", store: "تيكسي بلي", icon: "👑", basePrice: 50 },
            { name: "تيكسي بلي - 5000 نقطة", store: "تيكسي بلي", icon: "🎯", basePrice: 30 },
            { name: "تيكسي بلي - شحن ألعاب", store: "تيكسي بلي", icon: "🚗", basePrice: 100 },
            
            // أمازون
            { name: "أمازون برايم - سنة", store: "أمازون", icon: "📦", basePrice: 140 },
            { name: "سماعات AirPods Pro", store: "أمازون", icon: "🎧", basePrice: 250 },
            { name: "ساعة آبل الترا", store: "أمازون", icon: "⌚", basePrice: 800 },
            
            // علي إكسبرس
            { name: "سماعات بلوتوث", store: "علي إكسبرس", icon: "🎧", basePrice: 40 },
            { name: "ساعة ذكية", store: "علي إكسبرس", icon: "⌚", basePrice: 50 },
            { name: "حافظة هاتف", store: "علي إكسبرس", icon: "📱", basePrice: 20 },
            { name: "كابل USB-C", store: "علي إكسبرس", icon: "🔌", basePrice: 15 },
            { name: "بنك طاقة 20000mAh", store: "علي إكسبرس", icon: "🔋", basePrice: 35 },
            
            // تطبيقات
            { name: "نتفليكس بريميوم", store: "نتفليكس", icon: "🎬", basePrice: 20 },
            { name: "سبوتيفاي بريميوم", store: "سبوتيفاي", icon: "🎵", basePrice: 10 },
            { name: "يوتيوب بريميوم", store: "يوتيوب", icon: "▶️", basePrice: 12 },
        ];

        let currentDeals = [];
        let autoRefreshInterval;

        // توليد خصم عشوائي
        function getRandomDiscount(min = 5, max = 90) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        // حساب السعر بعد الخصم
        function calculateSalePrice(basePrice, discountPercent) {
            return (basePrice * (1 - discountPercent / 100)).toFixed(2);
        }

        // توليد وقت انتهاء وهمي
        function getRandomExpiry() {
            const hours = Math.floor(Math.random() * 72) + 1;
            const minutes = Math.floor(Math.random() * 60);
            return `${hours} ساعة و ${minutes} دقيقة`;
        }

        // اختيار منتجات عشوائية
        function getRandomProducts(count = 12) {
            const shuffled = [...productsDB].sort(() => Math.random() - 0.5);
            return shuffled.slice(0, count);
        }

        // توليد العروض
        function generateDeals(superMode = false) {
            const products = getRandomProducts(12);
            
            currentDeals = products.map(product => {
                const minDiscount = superMode ? 50 : 5;
                const maxDiscount = superMode ? 100 : 90;
                const discount = getRandomDiscount(minDiscount, maxDiscount);
                
                return {
                    ...product,
                    discount: discount,
                    salePrice: calculateSalePrice(product.basePrice, discount),
                    expiry: getRandomExpiry(),
                    isSuper: discount >= 80
                };
            });

            // ترتيب تنازلي حسب الخصم
            currentDeals.sort((a, b) => b.discount - a.discount);
            
            displayDeals();
            updateStats();
            createParticles();
            showNotification('✅ تم توليد خصومات جديدة!');
        }

        // توليد خصومات خارقة
        function generateSuperDeals() {
            generateDeals(true);
            showNotification('💎 تم توليد خصومات خارقة تصل إلى 100%!');
        }

        // تجديد خصم واحد عشوائي
        function refreshSingleDeal() {
            if (currentDeals.length === 0) {
                generateDeals();
                return;
            }
            
            const randomIndex = Math.floor(Math.random() * currentDeals.length);
            const product = productsDB[Math.floor(Math.random() * productsDB.length)];
            
            const discount = getRandomDiscount(5, 100);
            currentDeals[randomIndex] = {
                ...product,
                discount: discount,
                salePrice: calculateSalePrice(product.basePrice, discount),
                expiry: getRandomExpiry(),
                isSuper: discount >= 80
            };
            
            currentDeals.sort((a, b) => b.discount - a.discount);
            displayDeals();
            updateStats();
            showNotification('🔄 تم تجديد خصم واحد!');
        }

        // عرض العروض
        function displayDeals() {
            const grid = document.getElementById('dealsGrid');
            grid.innerHTML = '';
            
            currentDeals.forEach((deal, index) => {
                const card = document.createElement('div');
                card.className = 'deal-card';
                card.style.animation = `fadeIn 0.5s ${index * 0.1}s both`;
                
                let discountClass = 'discount-low';
                if (deal.discount >= 70) discountClass = 'discount-high';
                else if (deal.discount >= 40) discountClass = 'discount-medium';
                
                card.innerHTML = `
                    <div class="discount-circle ${discountClass}">-${deal.discount}%</div>
                    <div class="deal-icon">${deal.icon}</div>
                    <h3 class="deal-title">${deal.name}</h3>
                    <p class="deal-store">🏪 ${deal.store}</p>
                    <div class="deal-price">
                        <span class="old-price">$${deal.basePrice}</span>
                        <span class="new-price">$${deal.salePrice}</span>
                    </div>
                    <div class="timer">⏰ ينتهي خلال ${deal.expiry}</div>
                    <button class="get-deal-btn" onclick="getDeal('${deal.name}', ${deal.discount})">
                        🚀 احصل على العرض
                    </button>
                `;
                
                grid.appendChild(card);
            });
        }

        // تحديث الإحصائيات
        function updateStats() {
            document.getElementById('dealCount').textContent = currentDeals.length;
            
            if (currentDeals.length > 0) {
                const highest = Math.max(...currentDeals.map(d => d.discount));
                const avg = Math.round(currentDeals.reduce((sum, d) => sum + d.discount, 0) / currentDeals.length);
                
                document.getElementById('highestDiscount').textContent = highest + '%';
                document.getElementById('avgDiscount').textContent = avg + '%';
            }
        }

        // الضغط على زر العرض
        function getDeal(dealName, discount) {
            const messages = [
                `🎉 مبروك! حصلت على خصم ${discount}% على ${dealName}`,
                `🔥 عرض حار! خصم ${discount}% على ${dealName}`,
                `⚡ صفقة! وفر ${discount}% على ${dealName}`,
                `💎 عرض ممتاز! ${dealName} بخصم ${discount}%`,
            ];
            
            const randomMsg = messages[Math.floor(Math.random() * messages.length)];
            showNotification(randomMsg);
            
            // تأثير جسيمات
            createParticles();
        }

        // إظهار إشعار
        function showNotification(message) {
            const existing = document.querySelector('.notification');
            if (existing) existing.remove();
            
            const notification = document.createElement('div');
            notification.className = 'notification';
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }

        // تأثير الجسيمات
        function createParticles() {
            const emojis = ['🎉', '✨', '💎', '🔥', '⭐', '💰', '🎯', '💥'];
            const container = document.getElementById('particles');
            
            for (let i = 0; i < 15; i++) {
                const particle = document.createElement('span');
                particle.className = 'particle';
                particle.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 50 + '%';
                particle.style.animationDuration = (Math.random() * 2 + 2) + 's';
                container.appendChild(particle);
                
                setTimeout(() => particle.remove(), 4000);
            }
        }

        // بدء التشغيل
        generateDeals();

        // تجديد تلقائي كل 30 ثانية
        autoRefreshInterval = setInterval(() => {
            generateDeals();
            showNotification('🔄 تم تجديد الخصومات تلقائياً!');
        }, 30000);

        // إضافة أنيميشن CSS
        const style = document.createElement('style');
        style.textContent = `
            @keyframes fadeIn {
                from {
                    opacity: 0;
                    transform: translateY(20px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
