<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z8 Store</title>
    <style>
        body { background: #050b07; color: #fff; font-family: Tahoma, sans-serif; padding: 10px; margin: 0; }
        .box { background: #0b1710; border: 1px solid #132d1d; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        button { background: #00ff66; color: #000; border: none; padding: 8px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; }
        input, select { width: 100%; padding: 8px; margin: 5px 0 10px 0; background: #050b07; border: 1px solid #132d1d; color: #fff; border-radius: 5px; box-sizing: border-box; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
        .card { background: #050b07; border: 1px solid #132d1d; padding: 10px; border-radius: 8px; text-align: center; display: flex; flex-direction: column; justify-content: space-between; }
        .card img { width: 100%; height: 120px; object-fit: cover; border-radius: 5px; margin-bottom: 8px; cursor: pointer; transition: 0.2s; }
        .card img:hover { opacity: 0.8; }
        .admin-panel { display: none; }
        .logo-circle { width: 45px; height: 45px; border: 2px solid #00ff66; border-radius: 50%; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #000; }
        .logo-circle img { width: 100%; height: 100%; object-fit: cover; }
        .filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; margin-bottom: 15px; }
        .filter-btn { background: #0b1710; color: #8aa895; border: 1px solid #132d1d; padding: 6px 12px; border-radius: 20px; cursor: pointer; white-space: nowrap; }
        .filter-btn.active { background: #00ff66; color: #000; font-weight: bold; }
        .del-btn { background: #ef4444; color: #fff; padding: 5px 10px; font-size: 0.8rem; border-radius: 5px; border: none; cursor: pointer; font-weight: bold; }
        .status-badge { display: inline-block; padding: 4px 8px; border-radius: 5px; font-size: 0.75rem; font-weight: bold; margin-bottom: 8px; }
        .status-available { background: rgba(0, 255, 102, 0.2); color: #00ff66; border: 1px solid #00ff66; }
        .status-busy { background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid #ef4444; }
        
        .admin-manage-list { max-height: 180px; overflow-y: auto; background: #050b07; border: 1px solid #132d1d; padding: 10px; border-radius: 5px; margin-top: 10px; }
        .admin-item-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #132d1d; font-size: 0.85rem; }

        /* نافذة تكبير الصورة */
        .modal { display: none; position: fixed; z-index: 999; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; }
        .modal img { max-width: 90%; max-height: 90%; border-radius: 10px; border: 2px solid #00ff66; }
        .close-modal { position: absolute; top: 20px; left: 20px; color: #fff; font-size: 30px; cursor: pointer; background: #ef4444; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<div class="box" style="display: flex; justify-content: space-between; align-items: center;">
    <button onclick="toggleAdmin()">لوحة التحكم (Admin)</button>
    <div style="display: flex; align-items: center; gap: 10px;">
        <h2>Z8 Store</h2>
        <div class="logo-circle" id="logoContainer">
            <span style="font-size: 10px; color: #00ff66;">Z8</span>
        </div>
    </div>
</div>

<!-- لوحة التحكم -->
<div class="box admin-panel" id="adminPanel">
    <h3>⚙️ لوحة التحكم</h3>
    
    <label>إضافة شعار للمتجر (من الألبوم):</label>
    <input type="file" id="logoImage" accept="image/*" onchange="updateLogo()">

    <hr style="border-color: #132d1d; margin: 15px 0;">

    <label>تغيير كلمة المرور (بكلمة التأكيد RAEZAR):</label>
    <input type="password" id="confirmKey" placeholder="اكتب كلمة التأكيد RAEZAR هنا">
    <input type="password" id="newPass" placeholder="كلمة المرور الجديدة لوحة التحكم">
    <button onclick="changePass()" style="background:#f59e0b;">تغيير كلمة المرور</button>

    <hr style="border-color: #132d1d; margin: 15px 0;">

    <label>إضافة قسم جديد:</label>
    <input type="text" id="catName" placeholder="اسم القسم الجديد...">
    <button onclick="addCategory()" style="background:#3b82f6; color:#fff;">إضافة القسم</button>

    <hr style="border-color: #132d1d; margin: 15px 0;">

    <label>إضافة منتج جديد:</label>
    <input type="text" id="pName" placeholder="اسم المنتج">
    <input type="text" id="pPrice" placeholder="السعر">
    <select id="pCat"></select>
    
    <label>حالة المنتج:</label>
    <select id="pStatus">
        <option value="available">🟢 متوفر</option>
        <option value="busy">🔴 غير متوفر</option>
    </select>

    <input type="file" id="pImage" accept="image/*">
    <button onclick="addProduct()">حفظ ونشر المنتج</button>

    <hr style="border-color: #132d1d; margin: 15px 0;">
    <label>🗑️ إدارة ومسح المنتجات (من لوحة التحكم فقط):</label>
    <div class="admin-manage-list" id="adminManageList">
        <!-- المنتجات للحذف تظهر هنا -->
    </div>
</div>

<!-- الأقسام الفلاتر -->
<div class="filters" id="filtersContainer"></div>

<!-- المنتجات -->
<div class="box">
    <h3>المنتجات المعروضة</h3>
    <div class="grid" id="productsGrid"></div>
</div>

<!-- نافذة تكبير الصورة -->
<div class="modal" id="imageModal" onclick="closeImageModal()">
    <span class="close-modal">&times;</span>
    <img id="modalImg">
</div>

<script>
    let adminPass = localStorage.getItem('z8_pass') || "1234";
    let categories = JSON.parse(localStorage.getItem('z8_cats')) || [{id: 'all', name: 'الكل'}];
    let products = JSON.parse(localStorage.getItem('z8_prods')) || [];
    let currentFilter = 'الكل';
    let storeLogo = localStorage.getItem('z8_logo') || '';

    if(storeLogo) {
        document.getElementById('logoContainer').innerHTML = `<img src="${storeLogo}">`;
    }

    function toggleAdmin() {
        let p = prompt("أدخل كلمة المرور لوحة التحكم:");
        if(p === adminPass) {
            let panel = document.getElementById('adminPanel');
            panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
            updateCatsSelect();
            renderAdminManageList();
        } else if(p !== null) {
            alert("كلمة المرور خطأ!");
        }
    }

    function updateLogo() {
        let file = document.getElementById('logoImage').files[0];
        if(file) {
            let reader = new FileReader();
            reader.onload = function(e) {
                storeLogo = e.target.result;
                localStorage.setItem('z8_logo', storeLogo);
                document.getElementById('logoContainer').innerHTML = `<img src="${storeLogo}">`;
                alert("تم تحديث الشعار بنجاح!");
            }
            reader.readAsDataURL(file);
        }
    }

    function changePass() {
        let key = document.getElementById('confirmKey').value;
        let np = document.getElementById('newPass').value;

        if(key !== "RAEZAR") {
            alert("كلمة التأكيد (RAEZAR) غير صحيحة!");
            return;
        }

        if(!np) {
            alert("الرجاء كتابة كلمة المرور الجديدة!");
            return;
        }

        adminPass = np;
        localStorage.setItem('z8_pass', adminPass);
        document.getElementById('confirmKey').value = '';
        document.getElementById('newPass').value = '';
        alert("تم تغيير كلمة المرور بنجاح!");
    }

    function addCategory() {
        let name = document.getElementById('catName').value.trim();
        if(name) {
            categories.push({id: 'c_' + Date.now(), name: name});
            localStorage.setItem('z8_cats', JSON.stringify(categories));
            document.getElementById('catName').value = '';
            renderCategories();
            updateCatsSelect();
            alert("تم إضافة القسم بنجاح!");
        } else {
            alert("الرجاء كتابة اسم القسم");
        }
    }

    function renderCategories() {
        let container = document.getElementById('filtersContainer');
        container.innerHTML = '';
        categories.forEach(c => {
            let activeClass = currentFilter === c.name ? 'active' : '';
            container.innerHTML += `<button class="filter-btn ${activeClass}" onclick="filterProducts('${c.name}')">${c.name}</button>`;
        });
    }

    function filterProducts(catName) {
        currentFilter = catName;
        renderCategories();
        renderProducts();
    }

    function updateCatsSelect() {
        let select = document.getElementById('pCat');
        select.innerHTML = '';
        categories.forEach(c => {
            if(c.name !== 'الكل') {
                select.innerHTML += `<option value="${c.name}">${c.name}</option>`;
            }
        });
    }

    function addProduct() {
        let name = document.getElementById('pName').value.trim();
        let price = document.getElementById('pPrice').value.trim();
        let cat = document.getElementById('pCat').value;
        let status = document.getElementById('pStatus').value;
        let fileInput = document.getElementById('pImage');

        if(!name || !price) {
            alert("املأ اسم المنتج والسعر!");
            return;
        }

        if(!cat) {
            alert("يرجى إضافة قسم أولاً لتتمكن من اختيار قسم للمنتج!");
            return;
        }

        if(fileInput.files && fileInput.files[0]) {
            let reader = new FileReader();
            reader.onload = function(e) {
                saveProd(name, price, cat, status, e.target.result);
            }
            reader.readAsDataURL(fileInput.files[0]);
        } else {
            saveProd(name, price, cat, status, '');
        }
    }

    function saveProd(name, price, cat, status, img) {
        let newId = Date.now();
        products.push({id: newId, name, price, cat, status, img});
        localStorage.setItem('z8_prods', JSON.stringify(products));
        
        document.getElementById('pName').value = '';
        document.getElementById('pPrice').value = '';
        document.getElementById('pImage').value = '';
        
        renderProducts();
        renderAdminManageList();
        alert("تم إضافة ونشر المنتج بنجاح!");
    }

    function deleteProduct(id) {
        if(confirm("هل أنت متأكد من حذف هذا المنتج من لوحة التحكم؟")) {
            products = products.filter(p => p.id !== id);
            localStorage.setItem('z8_prods', JSON.stringify(products));
            renderProducts();
            renderAdminManageList();
        }
    }

    function openImageModal(imgSrc) {
        if(!imgSrc) return;
        document.getElementById('modalImg').src = imgSrc;
        document.getElementById('imageModal').style.display = 'flex';
    }

    function closeImageModal() {
        document.getElementById('imageModal').style.display = 'none';
    }

    function renderAdminManageList() {
        let listContainer = document.getElementById('adminManageList');
        if(!listContainer) return;
        listContainer.innerHTML = '';

        if(products.length === 0) {
            listContainer.innerHTML = '<div style="color:#8aa895; text-align:center; font-size:0.8rem;">لا توجد منتجات حالياً</div>';
            return;
        }

        products.forEach(p => {
            listContainer.innerHTML += `
                <div class="admin-item-row">
                    <span>${p.name} (${p.price})</span>
                    <button class="del-btn" onclick="deleteProduct(${p.id})">حذف</button>
                </div>
            `;
        });
    }

    function renderProducts() {
        let grid = document.getElementById('productsGrid');
        grid.innerHTML = '';
        
        let filtered = currentFilter === 'الكل' ? products : products.filter(p => p.cat === currentFilter);

        if(filtered.length === 0) {
            grid.innerHTML = '<p style="color:#8aa895; grid-column:1/-1; text-align:center;">لا توجد منتجات في هذا القسم حالياً</p>';
            return;
        }
        
        filtered.forEach(p => {
            let statusHtml = p.status === 'available' 
                ? '<div class="status-badge status-available">🟢 متوفر</div>' 
                : '<div class="status-badge status-busy">🔴 غير متوفر</div>';

            let imgHtml = p.img ? `<img src="${p.img}" onclick="openImageModal('${p.img}')" alt="صورة المنتج">` : '';

            grid.innerHTML += `
                <div class="card">
                    <div>
                        ${imgHtml}
                        <h4>${p.name}</h4>
                        <p style="color:#00ff66; font-weight:bold; margin:5px 0;">${p.price}</p>
                        ${statusHtml}
                        <br><small style="color:#8aa895;">القسم: ${p.cat}</small>
                    </div>
                </div>
            `;
        });
    }

    renderCategories();
    renderProducts();
    renderAdminManageList();
</script>

</body>
</html>
