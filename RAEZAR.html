<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>AI Chat</title>
<style>
body{
background:#0f172a;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}
.chat{
width:700px;
background:#1e293b;
padding:20px;
border-radius:15px;
color:white;
}
#messages{
height:400px;
overflow:auto;
border:1px solid #334155;
padding:10px;
margin-bottom:10px;
}
input{
width:80%;
padding:10px;
}
button{
padding:10px;
background:#3b82f6;
color:white;
border:none;
cursor:pointer;
}
</style>
</head>
<body>

<div class="chat">
<h2>🤖 موقعي للذكاء الاصطناعي</h2>

<div id="messages"></div>

<input id="msg" placeholder="اكتب رسالتك...">
<button onclick="send()">إرسال</button>

</div>

<script>
async function send(){

let text=document.getElementById("msg").value;

if(text=="") return;

document.getElementById("messages").innerHTML +=
"<p><b>أنت:</b> "+text+"</p>";

document.getElementById("msg").value="";

const response = await fetch("https://api.openai.com/v1/responses",{
method:"POST",
headers:{
"Content-Type":"application/json",
"Authorization":"Bearer ضع_مفتاح_API_هنا"
},
body:JSON.stringify({
model:"gpt-5",
input:text
})
});

const data=await response.json();

document.getElementById("messages").innerHTML +=
"<p><b>AI:</b> "+(data.output?.[0]?.content?.[0]?.text || "لا يوجد رد")+"</p>";

}
</script>

</body>
</html>
