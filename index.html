<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z8 Store - المتجر الرقمي المتكامل</title>
    <style>
        :root {
            --primary-color: #6366f1;
            --secondary-color: #4f46e5;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --danger-color: #ef4444;
            --border-color: #334155;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 35px;
            border-radius: 16px;
            margin-bottom: 25px;
            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4);
        }
        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        .admin-panel {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            margin-bottom: 25px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .admin-panel h3 {
            margin-bottom: 20px;
            color: #818cf8;
            font-size: 1.3rem;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-muted);
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            outline: none;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: var(--primary-color);
        }
        button.btn-main {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
            width: 100%;
            transition: opacity 0.3s;
        }
        button.btn-main:hover {
            opacity: 0.9;
        }
        .section-box {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            margin-bottom: 25px;
            border: 1px solid var(--border-color);
        }
        .section-header {
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 12px;
            margin-bottom: 20px;
        }
        .section-header img {
            width: 38px;
            height: 38px;
            object-fit: contain;
            border-radius: 8px;
        }
        .section-header h2 {
            font-size: 1.4rem;
            color: var(--text-color);
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 18px;
        }
        .product-card {
            background: #0f172a;
            border: 1px solid var(--border-color);
            padding: 18px;
            border-radius: 12px;
            text-align: center;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .product-card-top {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 12px;
        }
        .product-card-top img {
            width: 28px;
            height: 28px;
            object-fit: contain;
        }
        .product-card h4 {
            font-size: 1.2rem;
            color: white;
        }
        .product-card p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 12px;
        }
        .product-price {
            font-weight: bold;
            color: #34d399;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }
        .delete-btn {
            background-color: var(--danger-color);
            color: white;
            border: none;
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: bold;
            transition: background 0.2s;
        }
        .delete-btn:hover {
            background-color: #dc2626;
        }
        .empty-msg {
            color: var(--text-muted);
            text-align: center;
            grid-column: 1 / -1;
            padding: 15px;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Z8 Store</h1>
        <p>متجرك السحابي الذكي - البيانات محفوظة بذاكرة المتصفح للأبد ولن تختفي أبداً</p>
    </header>

    <!-- لوحة التحكم للإضافة -->
    <div class="admin-panel">
        <h3>➕ إضافة منتج جديد لأي قسم</h3>
        <div class="form-group">
            <label for="pName">اسم المنتج:</label>
            <input type="text" id="pName" placeholder="مثال: شحن رويال باس، اشتراك نتفليكس...">
        </div>
        <div class="form-group">
            <label for="pDesc">وصف المنتج:</label>
            <input type="text" id="pDesc" placeholder="أدخل تفاصيل قصيرة عن المنتج...">
        </div>
        <div class="form-group">
            <label for="pPrice">السعر:</label>
            <input type="text" id="pPrice" placeholder="مثال: $10 أو 10,000 د.ع">
        </div>
        <div class="form-group">
            <label for="pCategory">اختر القسم والتطبيق:</label>
            <select id="pCategory">
                <option value="pubg">🎮 قسم ببجي موبايل (PUBG)</option>
                <option value="discord">💬 قسم ديسكورد (Discord)</option>
                <option value="netflix">🎬 قسم نتفليكس (Netflix)</option>
                <option value="spotify">🎵 قسم سبوتيفาย (Spotify)</option>
            </select>
        </div>
        <button class="btn-main" onclick="addProduct()">حفظ وإضافة المنتج للمتجر</button>
    </div>

    <!-- قسم ببجي موبايل -->
    <div class="section-box">
        <div class="section-header">
            <img src="https://cdn-icons-png.flaticon.com/512/8157/8157128.png" alt="PUBG">
            <h2>ببجي موبايل (PUBG Mobile)</h2>
        </div>
        <div id="pubg" class="products-grid"></div>
    </div>

    <!-- قسم ديسكورد -->
    <div class="section-box">
        <div class="section-header">
            <img src="https://assets-global.website-files.com/6257adef93867e50d84d30e2/636e0a6a49cf127bf92de1e2_icon_clyde_blurple_RGB.png" alt="Discord">
            <h2>ديسكورد (Discord)</h2>
        </div>
        <div id="discord" class="products-grid"></div>
    </div>

    <!-- قسم نتفليكس -->
    <div class="section-box">
        <div class="section-header">
            <img src="https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg" alt="Netflix">
            <h2>نتفليكس (Netflix)</h2>
        </div>
        <div id="netflix" class="products-grid"></div>
    </div>

    <!-- قسم سبوتيفاي -->
    <div class="section-box">
        <div class="section-header">
            <img src="https://upload.wikimedia.org/wikipedia/commons/1/19/Spotify_logo_without_text.svg" alt="Spotify">
            <h2>سبوتيفاي (Spotify)</h2>
        </div>
        <div id="spotify" class="products-grid"></div>
    </div>
</div>

<script>
    // أيقونات الأقسام لربطها بالمنتجات المضافة
    const iconsMap = {
        pubg: 'https://cdn-icons-png.flaticon.com/512/8157/8157128.png',
        discord: 'https://assets-global.website-files.com/6257adef93867e50d84d30e2/636e0a6a49cf127bf92de1e2_icon_clyde_blurple_RGB.png',
        netflix: 'https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg',
        spotify: 'https://upload.wikimedia.org/wikipedia/commons/1/19/Spotify_logo_without_text.svg'
    };

    // جلب المنتجات المخزنة مسبقاً من ذاكرة المتصفح
    let products = JSON.parse(localStorage.getItem('z8_store_permanent_products')) || [];

    function saveAndRender() {
        localStorage.setItem('z8_store_permanent_products', JSON.stringify(products));
        renderProducts();
    }

    function addProduct() {
        const name = document.getElementById('pName').value.trim();
        const desc = document.getElementById('pDesc').value.trim();
        const price = document.getElementById('pPrice').value.trim();
        const category = document.getElementById('pCategory').value;

        if(!name || !price) {
            alert('الرجاء إدخال اسم المنتج والسعر على الأقل!');
            return;
        }

        const newProduct = {
            id: Date.now(),
            name,
            desc,
            price,
            category
        };

        products.push(newProduct);
        saveAndRender();

        // تفريغ الحقول بعد الإضافة
        document.getElementById('pName').value = '';
        document.getElementById('pDesc').value = '';
        document.getElementById('pPrice').value = '';
    }

    function deleteProduct(id) {
        products = products.filter(p => p.id !== id);
        saveAndRender();
    }

    function renderProducts() {
        // تفريغ كافة الأقسام قبل إعادة تعبئتها
        const categories = ['pubg', 'discord', 'netflix', 'spotify'];
        categories.forEach(cat => {
            document.getElementById(cat).innerHTML = '<div class="empty-msg">لا توجد منتجات في هذا القسم حالياً</div>';
        });

        // توزيع المنتجات على أقسامها
        products.forEach(p => {
            const targetCategory = document.getElementById(p.category);
            if(targetCategory) {
                // إذا كانت رسالة "لا توجد منتجات" موجودة، قم بإزالتها عند أول إضافة
                const emptyMsg = targetCategory.querySelector('.empty-msg');
                if(emptyMsg) {
                    emptyMsg.remove();
                }

                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div>
                        <div class="product-card-top">
                            <img src="${iconsMap[p.category]}" alt="icon">
                            <h4>${p.name}</h4>
                        </div>
                        <p>${p.desc || 'لا يوجد وصف مضاف'}</p>
                        <div class="product-price">${p.price}</div>
                    </div>
                    <button class="delete-btn" onclick="deleteProduct(${p.id})">حذف المنتج</button>
                `;
                targetCategory.appendChild(card);
            }
        });
    }

    // تشغيل العرض عند تحميل الصفحة فوراً
    renderProducts();
</script>

</body>
</html>
