<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z8 Store - المتجر الرقمي المتكامل</title>
    <style>
        :root {
            --primary-color: #6366f1;
            --secondary-color: #4f46e5;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --danger-color: #ef4444;
            --border-color: #334155;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 35px;
            border-radius: 16px;
            margin-bottom: 25px;
            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4);
        }
        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        .admin-panel {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            margin-bottom: 25px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .admin-panel h3 {
            margin-bottom: 15px;
            color: #818cf8;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: var(--text-muted);
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            outline: none;
        }
        button.btn-main {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            width: 100%;
            transition: opacity 0.3s;
        }
        button.btn-main:hover {
            opacity: 0.9;
        }
        .section-box {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            margin-bottom: 25px;
            border: 1px solid var(--border-color);
        }
        .section-header {
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .section-header h2 {
            font-size: 1.4rem;
            color: var(--text-color);
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 18px;
        }
        .product-card {
            background: #0f172a;
            border: 1px solid var(--border-color);
            padding: 18px;
            border-radius: 12px;
            text-align: center;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .product-card h4 {
            font-size: 1.2rem;
            margin-bottom: 8px;
            color: white;
        }
        .product-card p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 10px;
        }
        .product-price {
            font-weight: bold;
            color: #34d399;
            margin-bottom: 12px;
            font-size: 1.1rem;
        }
        .delete-btn {
            background-color: var(--danger-color);
            color: white;
            border: none;
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: bold;
            transition: background 0.2s;
        }
        .delete-btn:hover {
            background-color: #dc2626;
        }
        .empty-msg {
            color: var(--text-muted);
            text-align: center;
            grid-column: 1 / -1;
            padding: 15px;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Z8 Store</h1>
        <p>متجرا الرقمي الاحترافي - البيانات محفوظة بشكل دائم ولا تختفي أبداً</p>
    </header>

    <!-- لوحة التحكم للإضافة -->
    <div class="admin-panel">
        <h3>➕ إضافة منتج جديد لأي قسم</h3>
        <div class="form-group">
            <label for="pName">اسم المنتج:</label>
            <input type="text" id="pName" placeholder="مثال: ديسكورد نايترو شهر، حساب ستيم...">
        </div>
        <div class="form-group">
            <label for="pDesc">وصف المنتج:</label>
            <input type="text" id="pDesc" placeholder="تفاصيل المنتج...">
        </div>
        <div class="form-group">
            <label for="pPrice">السعر:</label>
            <input type="text" id="pPrice" placeholder="مثال: $10 أو 10,000 د.ع">
        </div>
        <div class="form-group">
            <label for="pCategory">اختر القسم المناسب:</label>
            <select id="pCategory">
                <option value="discord">💬 خدمات ديسكورد (نايترو، بوستات، برمجة، أعضاء، إفكتات)</option>
                <option value="accounts">🎮 الحسابات والألعاب (ستيم، رينبو، راست، كراند، نتفليكس، ويندوز، كيم باس)</option>
                <option value="fivem">🎙️ فايف ام (إعلانات صوتية وخدمات)</option>
            </select>
        </div>
        <button class="btn-main" onclick="addProduct()">حفظ وإضافة المنتج للمتجر</button>
    </div>

    <!-- قسم ديسكورد -->
    <div class="section-box">
        <div class="section-header">
            <h2>💬 قسم خدمات ديسكورد (نايترو، برمجة، بوستات، إفكتات)</h2>
        </div>
        <div id="discord" class="products-grid"></div>
    </div>

    <!-- قسم الحسابات والألعاب -->
    <div class="section-box">
        <div class="section-header">
            <h2>🎮 قسم الحسابات والاشتراكات (ستيم، رينبو، نتفليكس، كيم باس)</h2>
        </div>
        <div id="accounts" class="products-grid"></div>
    </div>

    <!-- قسم فايف ام -->
    <div class="section-box">
        <div class="section-header">
            <h2>🎙️ قسم فايف ام (إعلانات صوتية وخدمات)</h2>
        </div>
        <div id="fivem" class="products-grid"></div>
    </div>
</div>

<script>
    // جلب المنتجات المخزنة مسبقاً بذاكرة المتصفح
    let products = JSON.parse(localStorage.getItem('z8_ultimate_store_products')) || [];

    function saveAndRender() {
        localStorage.setItem('z8_ultimate_store_products', JSON.stringify(products));
        renderProducts();
    }

    function addProduct() {
        const name = document.getElementById('pName').value.trim();
        const desc = document.getElementById('pDesc').value.trim();
        const price = document.getElementById('pPrice').value.trim();
        const category = document.getElementById('pCategory').value;

        if(!name || !price) {
            alert('الرجاء إدخال اسم المنتج والسعر على الأقل!');
            return;
        }

        const newProduct = {
            id: Date.now(),
            name,
            desc,
            price,
            category
        };

        products.push(newProduct);
        saveAndRender();

        // تفريغ الحقول بعد الإضافة
        document.getElementById('pName').value = '';
        document.getElementById('pDesc').value = '';
        document.getElementById('pPrice').value = '';
    }

    function deleteProduct(id) {
        products = products.filter(p => p.id !== id);
        saveAndRender();
    }

    function renderProducts() {
        // تفريغ الأقسام أولاً
        const categories = ['discord', 'accounts', 'fivem'];
        categories.forEach(cat => {
            document.getElementById(cat).innerHTML = '<div class="empty-msg">لا توجد منتجات في هذا القسم حالياً</div>';
        });

        products.forEach(p => {
            const targetCategory = document.getElementById(p.category);
            if(targetCategory) {
                const emptyMsg = targetCategory.querySelector('.empty-msg');
                if(emptyMsg) {
                    emptyMsg.remove();
                }

                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div>
                        <h4>${p.name}</h4>
                        <p>${p.desc || 'لا يوجد وصف مضاف'}</p>
                        <div class="product-price">${p.price}</div>
                    </div>
                    <button class="delete-btn" onclick="deleteProduct(${p.id})">حذف المنتج</button>
                `;
                targetCategory.appendChild(card);
            }
        });
    }

    // تشغيل العرض عند تحميل الصفحة
    renderProducts();
</script>

</body>
</html>
