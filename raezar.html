<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>AI Chat Pro</title>

<style>
body {
  font-family: Arial;
  background: #0f172a;
  color: white;
  margin: 0;
}

.container {
  max-width: 500px;
  margin: auto;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

.header {
  background: #1e293b;
  padding: 15px;
  text-align: center;
  font-size: 20px;
}

.chat {
  flex: 1;
  padding: 10px;
  overflow-y: auto;
}

.msg {
  margin: 10px 0;
  padding: 10px;
  border-radius: 10px;
  max-width: 80%;
}

.user {
  background: #2563eb;
  margin-left: auto;
}

.bot {
  background: #334155;
}

.input-area {
  display: flex;
  padding: 10px;
  background: #1e293b;
}

input {
  flex: 1;
  padding: 10px;
  border: none;
  outline: none;
  border-radius: 5px;
}

button {
  margin-left: 10px;
  padding: 10px;
  background: #22c55e;
  border: none;
  color: white;
  border-radius: 5px;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="container">
  <div class="header">🤖 AI Chat</div>

  <div class="chat" id="chat"></div>

  <div class="input-area">
    <input id="question" placeholder="اكتب سؤالك...">
    <button onclick="askAI()">إرسال</button>
  </div>
</div>

<script>
async function askAI() {
  let input = document.getElementById("question");
  let chat = document.getElementById("chat");

  let userText = input.value;
  if (!userText) return;

  chat.innerHTML += `<div class="msg user">${userText}</div>`;
  input.value = "";

  chat.innerHTML += `<div class="msg bot">جاري التفكير...</div>`;
  chat.scrollTop = chat.scrollHeight;

  try {
    const response = await fetch("https://api.openai.com/v1/chat/completions", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer YOUR_API_KEY"
      },
      body: JSON.stringify({
        model: "gpt-4o-mini",
        messages: [{ role: "user", content: userText }]
      })
    });

    const data = await response.json();

    document.querySelector(".bot:last-child").innerText =
      data.choices[0].message.content;

  } catch (error) {
    document.querySelector(".bot:last-child").innerText =
      "صار خطأ 😅";
  }

  chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>
