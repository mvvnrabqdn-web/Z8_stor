<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة تخفيضات الخدمات والبطاقات الرقمية</title>
    <style>
        :root {
            --primary-color: #6c5ce7;
            --secondary-color: #a29bfe;
            --bg-color: #f4f4f9;
            --card-bg: #ffffff;
            --text-color: #2d3436;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
        }
        header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            text-align: center;
            padding: 30px 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        header h1 {
            margin: 0;
            font-size: 2rem;
        }
        header p {
            margin: 10px 0 0;
            font-size: 1.1rem;
            opacity: 0.9;
        }
        .container {
            max-width: 600px;
            margin: 30px auto;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.08);
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: var(--text-color);
        }
        select, input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }
        select:focus, input:focus {
            border-color: var(--primary-color);
        }
        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
        }
        button:hover {
            background-color: #5b4cc4;
        }
        button:active {
            transform: scale(0.98);
        }
        .result-box {
            margin-top: 25px;
            padding: 20px;
            background-color: #f8f9fa;
            border-right: 5px solid var(--primary-color);
            border-radius: 6px;
            display: none;
        }
        .result-box h3 {
            margin-top: 0;
            color: var(--primary-color);
        }
        .result-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 1.05rem;
        }
        .error-msg {
            color: #e74c3c;
            font-weight: bold;
            margin-top: 15px;
            display: none;
            text-align: center;
        }
        .footer {
            text-align: center;
            margin-top: 40px;
            color: #888;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>حاسبة خصومات الخدمات والتطبيقات</h1>
        <p>احصل على خصومات فورية لتاكسي بلي، كريم، نتفليكس، والألعاب الشهيرة</p>
    </header>

    <div class="container">
        <!-- اختيار الخدمة -->
        <div class="form-group">
            <label for="serviceSelect">اختر الخدمة أو التطبيق:</label>
            <select id="serviceSelect" onchange="updateBasePrice()">
                <option value="taxi_bali" data-price="10">تاكسي بلي (Taxi Bali) - الرحلة الافتراضية</option>
                <option value="careem" data-price="12">كريم (Careem) - مشوار قياسي</option>
                <option value="netflix" data-price="15">نتفليكس (Netflix) - اشتراك شهري</option>
                <option value="pubg" data-price="20">لعبة باوبجي (PUBG UC) - شحن شدات</option>
                <option value="playstation" data-price="50">بطاقة بلايستيشن (PSN Card)</option>
            </select>
        </div>

        <!-- السعر الأصلي (يتم تحديثه تلقائياً) -->
        <div class="form-group">
            <label>السعر الأصلي:</label>
            <input type="text" id="originalPriceDisplay" value="10.00 $" disabled style="background-color: #e9ecef; font-weight: bold;">
        </div>

        <!-- إدخال كود الخصم -->
        <div class="form-group">
            <label for="promoCode">أدخل كود الخصم:</label>
            <input type="text" id="promoCode" placeholder="مثال: BALI20 أو NETFLIX50">
        </div>

        <button onclick="calculateDiscount()">تطبيق وتخمين الخصم</button>

        <!-- رسالة الخطأ -->
        <div id="errorMsg" class="error-msg">كود الخصم غير صحيح أو منتهي الصلاحية لهذه الخدمة!</div>

        <!-- صندوق النتائج -->
        <div id="resultBox" class="result-box">
            <h3>نتيجة الخصم</h3>
            <div class="result-item">
                <span>الخدمة المختارة:</span>
                <span id="resServiceName">-</span>
            </div>
            <div class="result-item">
                <span>السعر الأصلي:</span>
                <span id="resOriginal">-</span>
            </div>
            <div class="result-item">
                <span>قيمة الخصم:</span>
                <span id="resDiscountValue" style="color: #27ae60;">-</span>
            </div>
            <hr style="border: 0; border-top: 1px solid #ddd; margin: 10px 0;">
            <div class="result-item" style="font-weight: bold; font-size: 1.2rem;">
                <span>السعر النهائي:</span>
                <span id="resFinal" style="color: var(--primary-color);">-</span>
            </div>
        </div>
    </div>

    <div class="footer">
        جميع الحقوق محفوظة &copy; 2026
    </div>

    <script>
        // تحديث السعر الأصلي تلقائياً عند تغيير القائمة المنسدلة
        function updateBasePrice() {
            const select = document.getElementById('serviceSelect');
            const price = select.options[select.selectedIndex].getAttribute('data-price');
            document.getElementById('originalPriceDisplay').value = price + ' $';
            
            // إخفاء النتائج القديمة عند تغيير الخدمة
            document.getElementById('resultBox').style.display = 'none';
            document.getElementById('errorMsg').style.display = 'none';
        }

        function calculateDiscount() {
            const select = document.getElementById('serviceSelect');
            const serviceKey = select.value;
            const serviceName = select.options[select.selectedIndex].text;
            const originalPrice = parseFloat(select.options[select.selectedIndex].getAttribute('data-price'));
            const code = document.getElementById('promoCode').value.trim().toUpperCase();
            
            const errorMsg = document.getElementById('errorMsg');
            const resultBox = document.getElementById('resultBox');

            let discountPercent = 0;
            let isValidCode = false;

            // قاعدة بيانات الأكواد المخصصة لكل خدمة أو أكواد عامة
            if (serviceKey === 'taxi_bali') {
                if (code === 'BALI20' || code === 'TAXI20') {
                    discountPercent = 0.20; // خصم 20%
                    isValidCode = true;
                } else if (code === 'BALI50') {
                    discountPercent = 0.50; // خصم 50%
                    isValidCode = true;
                }
            } else if (serviceKey === 'careem') {
                if (code === 'CAREEM15' || code === 'RIDE10') {
                    discountPercent = 0.15;
                    isValidCode = true;
                }
            } else if (serviceKey === 'netflix') {
                if (code === 'NETFLIX30' || code === 'VIP2026') {
                    discountPercent = 0.30;
                    isValidCode = true;
                }
            } else if (serviceKey === 'pubg' || serviceKey === 'playstation') {
                if (code === 'GAMER10' || code === 'PROMO25') {
                    discountPercent = 0.25;
                    isValidCode = true;
                }
            }

            // كود عام ساري على الكل للتجربة
            if (code === 'SAVE10') {
                discountPercent = 0.10;
                isValidCode = true;
            }

            if (!isValidCode && code !== "") {
                errorMsg.style.display = 'block';
                resultBox.style.display = 'none';
                return;
            } else if (code === "") {
                errorMsg.style.display = 'block';
                errorMsg.textContent = 'الرجاء إدخال كود خصم أولاً!';
                resultBox.style.display = 'none';
                return;
            }

            errorMsg.style.display = 'none';

            // حساب القيم
            let discountValue = originalPrice * discountPercent;
            let finalPrice = originalPrice - discountValue;

            // عرض النتائج في واجهة المستخدم
            document.getElementById('resServiceName').textContent = serviceName;
            document.getElementById('resOriginal').textContent = originalPrice.toFixed(2) + ' $';
            document.getElementById('resDiscountValue').textContent = `- ${discountValue.toFixed(2)} $ (${discountPercent * 100}%)`;
            document.getElementById('resFinal').textContent = finalPrice.toFixed(2) + ' $';

            resultBox.style.display = 'block';
        }
    </script>
</body>
</html>
