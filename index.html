<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z8 Store - المتجر الرقمي</title>
    <!-- استدعاء مكتبات Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --border-color: #1e293b;
            --accent-color: #f59e0b; /* لون ذهبي شبيه بـ Dhahab Store */
            --accent-hover: #d97706;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }

        body { background: var(--bg-color); color: var(--text-main); font-family: Tahoma, sans-serif; padding: 0; margin: 0; box-sizing: border-box; }
        
        /* الهيدر العلوي */
        .header { background: #090d16; border-bottom: 1px solid var(--border-color); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .logo-area { display: flex; align-items: center; gap: 12px; }
        .logo-circle { width: 50px; height: 50px; border: 2px solid var(--accent-color); border-radius: 50%; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #000; box-shadow: 0 0 10px rgba(245, 158, 11, 0.3); }
        .logo-circle img { width: 100%; height: 100%; object-fit: cover; }
        .store-title { font-size: 1.2rem; font-weight: bold; color: var(--accent-color); }

        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }

        /* الأقسام الفلاتر */
        .filters { display: flex; gap: 10px; overflow-x: auto; padding: 10px 0; margin-bottom: 20px; scrollbar-width: none; }
        .filters::-webkit-scrollbar { display: none; }
        .filter-btn { background: var(--card-bg); color: var(--text-muted); border: 1px solid var(--border-color); padding: 8px 18px; border-radius: 20px; cursor: pointer; white-space: nowrap; transition: 0.3s; font-size: 0.9rem; }
        .filter-btn.active { background: var(--accent-color); color: #000; font-weight: bold; border-color: var(--accent-color); }

        /* شبكة المنتجات */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; }
        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; transition: 0.3s; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .card:hover { transform: translateY(-5px); border-color: var(--accent-color); }
        .card img { width: 100%; height: 140px; object-fit: cover; cursor: pointer; }
        .card-body { padding: 12px; }
        .card h4 { margin: 0 0 8px 0; font-size: 1rem; color: #fff; }
        .price { color: var(--accent-color); font-weight: bold; font-size: 1.1rem; margin-bottom: 8px; }
        
        .status-badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
        .status-available { background: rgba(16, 185, 129, 0.2); color: #10b981; border: 1px solid #10b981; }
        .status-busy { background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid #ef4444; }

        /* زر الشراء أو الطلب */
        .buy-btn { background: var(--accent-color); color: #000; border: none; width: 100%; padding: 8px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.2s; }
        .buy-btn:hover { background: var(--accent-hover); color: #fff; }

        /* زر الشات العائم (مطابق للصور) */
        .chat-widget-btn { position: fixed; bottom: 20px; left: 20px; background: var(--accent-color); color: #000; width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4); z-index: 999; font-size: 24px; transition: 0.3s; }
        .chat-widget-btn:hover { transform: scale(1.1); }

        /* نافذة الشات */
        .chat-modal { position: fixed; bottom: 90px; left: 20px; width: 320px; height: 420px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; display: none; flex-direction: column; z-index: 1000; box-shadow: 0 5px 25px rgba(0,0,0,0.5); overflow: hidden; }
        .chat-header { background: #090d16; padding: 12px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .chat-body { flex: 1; padding: 10px; overflow-y: auto; font-size: 0.85rem; display: flex; flex-direction: column; gap: 8px; }
        .chat-footer { padding: 10px; border-top: 1px solid var(--border-color); display: flex; gap: 5px; background: #090d16; }
        .chat-footer input { flex: 1; margin: 0; padding: 8px; font-size: 0.85rem; }
        .chat-footer button { padding: 8px 12px; margin: 0; }

        /* لوحة التحكم المخفية برابط مستقل */
        .admin-page { display: none; padding: 20px; max-width: 800px; margin: 0 auto; }
        .box { background: var(--card-bg); border: 1px solid var(--border-color); padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        input, select { width: 100%; padding: 10px; margin: 8px 0 12px 0; background: var(--bg-color); border: 1px solid var(--border-color); color: #fff; border-radius: 6px; box-sizing: border-box; }
        button { background: #3b82f6; color: #fff; border: none; padding: 8px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; }
        button:hover { opacity: 0.9; }
        .admin-manage-list { max-height: 200px; overflow-y: auto; background: var(--bg-color); border: 1px solid var(--border-color); padding: 10px; border-radius: 5px; }
        .admin-item-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border-color); font-size: 0.85rem; }
        .del-btn { background: #ef4444; padding: 4px 8px; font-size: 0.75rem; }

        /* نافذة تكبير الصور */
        .modal { display: none; position: fixed; z-index: 2000; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; }
        .modal img { max-width: 90%; max-height: 90%; border-radius: 10px; border: 2px solid var(--accent-color); }
        .close-modal { position: absolute; top: 20px; left: 20px; color: #fff; font-size: 25px; cursor: pointer; background: #ef4444; width: 35px; height: 35px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<!-- الهيدر -->
<div class="header">
    <div class="logo-area">
        <div class="logo-circle" id="logoContainer">
            <span style="font-size: 12px; color: var(--accent-color);">Z8</span>
        </div>
        <div class="store-title">Z8 Store</div>
    </div>
    <div>
        <a href="#admin" onclick="checkAdminAccess()" style="color: var(--text-muted); text-decoration: none; font-size: 0.85rem;">🔒 لوحة التحكم</a>
    </div>
</div>

<!-- واجهة المتجر الرئيسية -->
<div class="container" id="storeView">
    <!-- الأقسام الفلاتر -->
    <div class="filters" id="filtersContainer"></div>

    <!-- المنتجات -->
    <div class="box" style="border:none; background:transparent; padding:0;">
        <h3 style="color: var(--accent-color); margin-bottom: 15px;">المنتجات المعروضة</h3>
        <div class="grid" id="productsGrid"></div>
    </div>
</div>

<!-- لوحة التحكم (تفتح برابط أو كلمة مرور مستقلة) -->
<div class="admin-page" id="adminView">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h2>⚙️ لوحة تحكم المتجر</h2>
        <button onclick="exitAdmin()" style="background:#64748b;">العودة للمتجر</button>
    </div>

    <div class="box">
        <h3>تعديل شعار المتجر</h3>
        <input type="file" id="logoImage" accept="image/*" onchange="updateLogo()">
    </div>

    <div class="box">
        <h3>إدارة الأقسام</h3>
        <input type="text" id="catName" placeholder="اسم القسم الجديد (مثلاً: ستم أوفلاين)...">
        <button onclick="addCategory()">إضافة قسم</button>
        <div class="admin-manage-list" id="adminCatsList" style="margin-top:10px;"></div>
    </div>

    <div class="box">
        <h3>إضافة منتج جديد</h3>
        <input type="text" id="pName" placeholder="اسم المنتج (مثلاً: Battlefield 3)">
        <input type="text" id="pPrice" placeholder="السعر (مثلاً: 9,000 د.ع)">
        <select id="pCat"></select>
        <select id="pStatus">
            <option value="available">🟢 متوفر</option>
            <option value="busy">🔴 غير متوفر</option>
        </select>
        <input type="file" id="pImage" accept="image/*">
        <button onclick="addProduct()">نشر المنتج فوراً</button>
    </div>

    <div class="box">
        <h3>إدارة المنتجات المحذوفة/المعدلة</h3>
        <div class="admin-manage-list" id="adminManageList"></div>
    </div>
</div>

<!-- زر الشات الحي العائم -->
<div class="chat-widget-btn" onclick="toggleChat()">💬</div>

<!-- نافذة الشات الداخلي -->
<div class="chat-modal" id="chatModal">
    <div class="chat-header">
        <span style="font-weight: bold; color: var(--accent-color); font-size: 0.9rem;">دعم المتجر (Store Support)</span>
        <span style="cursor:pointer; color:#fff; font-size: 18px;" onclick="toggleChat()">&times;</span>
    </div>
    <div class="chat-body" id="chatMessages">
        <div style="background: rgba(245,158,11,0.1); padding: 8px; border-radius: 6px; text-align: center; color: var(--accent-color);">
            أهلاً بك! اطرح استفسارك وسنرد عليك في أقرب وقت.
        </div>
    </div>
    <div class="chat-footer">
        <input type="text" id="chatInput" placeholder="اكتب رسالتك هنا...">
        <button onclick="sendChatMessage()">إرسال</button>
    </div>
</div>

<!-- نافذة تكبير الصورة -->
<div class="modal" id="imageModal" onclick="closeImageModal()">
    <span class="close-modal">&times;</span>
    <img id="modalImg">
</div>

<script>
    // إعدادات Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyDUNN-QVK6-81yheeE22TiLnLsrFpjNNRD0",
      authDomain: "z8-store.firebaseapp.com",
      databaseURL: "https://z8-store-default-rtdb.firebaseio.com",
      projectId: "z8-store",
      storageBucket: "z8-store.appspot.com",
      messagingSenderId: "86927354883",
      appId: "1:86927354883:web:fc283316115beec41c44b6",
      measurementId: "G-KMRPTDC9VT"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let adminPass = "1234";
    let categories = [{id: 'all', name: 'الكل'}];
    let products = JSON.parse(localStorage.getItem('cached_products')) || [];
    let currentFilter = 'الكل';
    let storeLogo = localStorage.getItem('cached_logo') || '';

    if(storeLogo) {
        document.getElementById('logoContainer').innerHTML = `<img src="${storeLogo}">`;
    }

    renderProducts();

    // جلب البيانات من السحاب
    db.ref('settings/adminPass').on('value', (snapshot) => { if(snapshot.exists()) adminPass = snapshot.val(); });
    db.ref('settings/storeLogo').on('value', (snapshot) => {
        storeLogo = snapshot.val() || '';
        localStorage.setItem('cached_logo', storeLogo);
        if(storeLogo) document.getElementById('logoContainer').innerHTML = `<img src="${storeLogo}">`;
    });

    db.ref('categories').on('value', (snapshot) => {
        categories = [{id: 'all', name: 'الكل'}];
        snapshot.forEach((child) => categories.push(child.val()));
        renderCategories();
        updateCatsSelect();
        renderAdminCatsList();
    });

    db.ref('products').on('value', (snapshot) => {
        products = [];
        snapshot.forEach((child) => products.push({ ...child.val(), firebaseKey: child.key }));
        localStorage.setItem('cached_products', JSON.stringify(products));
        renderProducts();
        renderAdminManageList();
    });

    // نظام حماية واجهة التحكم برابط أو كلمة مرور
    function checkAdminAccess() {
        let p = prompt("أدخل كلمة مرور لوحة التحكم:");
        if(p === adminPass) {
            document.getElementById('storeView').style.display = 'none';
            document.getElementById('adminView').style.display = 'block';
            updateCatsSelect();
            renderAdminManageList();
            renderAdminCatsList();
        } else if(p !== null) {
            alert("كلمة المرور غير صحيحة!");
        }
    }

    function exitAdmin() {
        document.getElementById('adminView').style.display = 'none';
        document.getElementById('storeView').style.display = 'block';
    }

    // إدارة الشات الداخلي
    function toggleChat() {
        let chat = document.getElementById('chatModal');
        chat.style.display = chat.style.display === 'flex' ? 'none' : 'flex';
    }

    function sendChatMessage() {
        let input = document.getElementById('chatInput');
        let msg = input.value.trim();
        if(!msg) return;

        let chatBody = document.getElementById('chatMessages');
        chatBody.innerHTML += `<div style="background: #1e293b; padding: 8px; border-radius: 6px; text-align: left; margin-bottom: 5px;"><b>أنت:</b> ${msg}</div>`;
        input.value = '';
        chatBody.scrollTop = chatBody.scrollHeight;

        // حفظ الرسالة في فايربيس لو حبيت تظهر عندك بلوحة التحكم لاحقاً
        db.ref('chats').push({message: msg, time: Date.now()});
    }

    // دوال المنتجات والأقسام والشعار
    function updateLogo() {
        let file = document.getElementById('logoImage').files[0];
        if(file) {
            let reader = new FileReader();
            reader.onload = function(e) {
                db.ref('settings/storeLogo').set(e.target.result, () => alert("تم تحديث الشعار بنجاح!"));
            }
            reader.readAsDataURL(file);
        }
    }

    function addCategory() {
        let name = document.getElementById('catName').value.trim();
        if(name) {
            let ref = db.ref('categories').push();
            ref.set({id: ref.key, name: name}, () => {
                document.getElementById('catName').value = '';
                alert("تم إضافة القسم بنجاح!");
            });
        }
    }

    function deleteCategory(name) {
        if(confirm(`هل أنت متأكد من حذف قسم "${name}"؟`)) {
            db.ref('categories').once('value', (snap) => {
                snap.forEach((child) => { if(child.val().name === name) db.ref('categories/' + child.key).remove(); });
            });
        }
    }

    function addProduct() {
        let name = document.getElementById('pName').value.trim();
        let price = document.getElementById('pPrice').value.trim();
        let cat = document.getElementById('pCat').value;
        let status = document.getElementById('pStatus').value;
        let file = document.getElementById('pImage').files[0];

        if(!name || !price) {
            alert("يرجى ملء اسم المنتج والسعر!");
            return;
        }

        if(file) {
            let reader = new FileReader();
            reader.onload = (e) => saveProd(name, price, cat, status, e.target.result);
            reader.readAsDataURL(file);
        } else {
            saveProd(name, price, cat, status, '');
        }
    }

    function saveProd(name, price, cat, status, img) {
        let ref = db.ref('products').push();
        ref.set({id: ref.key, name, price, cat, status, img}, () => {
            document.getElementById('pName').value = '';
            document.getElementById('pPrice').value = '';
            document.getElementById('pImage').value = '';
            alert("تم نشر المنتج بنجاح!");
        });
    }

    function deleteProduct(key) {
        if(confirm("هل أنت متأكد من الحذف؟")) db.ref('products/' + key).remove();
    }

    function toggleProductStatus(key, status) {
        db.ref('products/' + key).update({status: status === 'available' ? 'busy' : 'available'});
    }

    function renderCategories() {
        let container = document.getElementById('filtersContainer');
        container.innerHTML = '';
        categories.forEach(c => {
            let active = currentFilter === c.name ? 'active' : '';
            container.innerHTML += `<button class="filter-btn ${active}" onclick="currentFilter='${c.name}';renderCategories();renderProducts();">${c.name}</button>`;
        });
    }

    updateCatsSelect = function() {
        let select = document.getElementById('pCat');
        if(!select) return;
        select.innerHTML = '';
        categories.forEach(c => { if(c.name !== 'الكل') select.innerHTML += `<option value="${c.name}">${c.name}</option>`; });
    }

    function renderProducts() {
        let grid = document.getElementById('productsGrid');
        if(!grid) return;
        grid.innerHTML = '';

        let filtered = currentFilter === 'الكل' ? products : products.filter(p => p.cat === currentFilter);

        if(filtered.length === 0) {
            grid.innerHTML = '<p style="color:var(--text-muted); grid-column:1/-1; text-align:center;">لا توجد منتجات متاحة حالياً</p>';
            return;
        }

        filtered.forEach(p => {
            let badge = p.status === 'available' ? '<span class="status-badge status-available">🟢 متوفر</span>' : '<span class="status-badge status-busy">🔴 غير متوفر</span>';
            let img = p.img ? `<img src="${p.img}" onclick="openImageModal('${p.img}')">` : '';

            grid.innerHTML += `
                <div class="card">
                    <div>
                        ${img}
                        <div class="card-body">
                            <h4>${p.name}</h4>
                            <div class="price">${p.price}</div>
                            ${badge}
                        </div>
                    </div>
                    <div style="padding: 12px; padding-top: 0;">
                        <button class="buy-btn" onclick="toggleChat()">استفسر / اطلب الآن</button>
                    </div>
                </div>
            `;
        });
    }

    function renderAdminCatsList() {
        let list = document.getElementById('adminCatsList');
        if(!list) return;
        list.innerHTML = '';
        categories.filter(c => c.name !== 'الكل').forEach(c => {
            list.innerHTML += `<div class="admin-item-row"><span>${c.name}</span><button class="del-btn" onclick="deleteCategory('${c.name}')">حذف</button></div>`;
        });
    }

    function renderAdminManageList() {
        let list = document.getElementById('adminManageList');
        if(!list) return;
        list.innerHTML = '';
        products.forEach(p => {
            list.innerHTML += `<div class="admin-item-row"><span><b>${p.name}</b></span><div><button onclick="toggleProductStatus('${p.firebaseKey}','${p.status}')" style="padding:4px 8px; font-size:0.75rem;">تغيير الحالة</button> <button class="del-btn" onclick="deleteProduct('${p.firebaseKey}')">حذف</button></div></div>`;
        });
    }

    function openImageModal(src) {
        document.getElementById('modalImg').src = src;
        document.getElementById('imageModal').style.display = 'flex';
    }

    function closeImageModal() {
        document.getElementById('imageModal').style.display = 'none';
    }
</script>
</body>
</html>
