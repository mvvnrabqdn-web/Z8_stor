<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z8 Store - المتجر الرقمي الأخضر</title>
    <style>
        :root {
            --primary-color: #059669;
            --secondary-color: #047857;
            --bg-color: #064e3b;
            --card-bg: #022c22;
            --text-color: #ecfdf5;
            --text-muted: #a7f3d0;
            --danger-color: #ef4444;
            --border-color: #065f46;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #021a14;
            color: var(--text-color);
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 35px;
            border-radius: 16px;
            margin-bottom: 25px;
            box-shadow: 0 10px 25px -5px rgba(5, 150, 105, 0.4);
        }
        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        /* شاشة تسجيل الدخول للوحة التحكم */
        .auth-box {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            margin-bottom: 25px;
            border: 1px solid var(--border-color);
            text-align: center;
        }
        .auth-box input {
            padding: 10px;
            width: 60%;
            max-width: 300px;
            background: #021a14;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            margin-left: 10px;
            outline: none;
        }
        .admin-panel {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            margin-bottom: 25px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: none; /* مخفية حتى يتم إدخال كلمة المرور */
        }
        .admin-panel h3 {
            margin-bottom: 20px;
            color: #34d399;
            font-size: 1.3rem;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-muted);
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 12px;
            background: #021a14;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            outline: none;
        }
        button.btn-main {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
            width: 100%;
            transition: opacity 0.3s;
        }
        button.btn-main:hover {
            opacity: 0.9;
        }
        .section-box {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            margin-bottom: 25px;
            border: 1px solid var(--border-color);
        }
        .section-header {
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 12px;
            margin-bottom: 20px;
        }
        .section-header img {
            width: 38px;
            height: 38px;
            object-fit: contain;
            border-radius: 8px;
        }
        .section-header h2 {
            font-size: 1.4rem;
            color: var(--text-color);
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 18px;
        }
        .product-card {
            background: #021a14;
            border: 1px solid var(--border-color);
            padding: 18px;
            border-radius: 12px;
            text-align: center;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .product-card-top {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 12px;
        }
        .product-card-top img {
            width: 28px;
            height: 28px;
            object-fit: contain;
        }
        .product-card h4 {
            font-size: 1.2rem;
            color: white;
        }
        .product-card p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 12px;
        }
        .product-price {
            font-weight: bold;
            color: #34d399;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }
        .delete-btn {
            background-color: var(--danger-color);
            color: white;
            border: none;
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: bold;
            transition: background 0.2s;
        }
        .delete-btn:hover {
            background-color: #dc2626;
        }
        .empty-msg {
            color: var(--text-muted);
            text-align: center;
            grid-column: 1 / -1;
            padding: 15px;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Z8 Store</h1>
        <p>متجرك الرقمي الأخضر - آمن، محمي، والبيانات محفوظة دائماً</p>
    </header>

    <!-- قفل مركز التحكم بكلمة المرور -->
    <div class="auth-box" id="authBox">
        <h3 style="margin-bottom: 15px; color: #34d399;">🔒 لوحة التحكم محمية</h3>
        <p style="margin-bottom: 15px; color: var(--text-muted);">أدخل كلمة المرور لإظهار لوحة التحكم والإدارة:</p>
        <input type="password" id="adminPassword" placeholder="أدخل كلمة المرور...">
        <button class="btn-main" style="width: auto; display: inline-block; padding: 10px 20px;" onclick="checkPassword()">دخول</button>
    </div>

    <!-- لوحة التحكم للإضافة (منتجات وأقسام) -->
    <div class="admin-panel" id="adminPanel">
        <h3 style="border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-bottom: 15px;">➕ إضافة قسم جديد للمتجر</h3>
        <div class="form-group">
            <label for="newCatId">معرف القسم بالانجليزي (بدون مسافات):</label>
            <input type="text" id="newCatId" placeholder="مثال: games أو cards">
        </div>
        <div class="form-group">
            <label for="newCatName">اسم القسم بالعربي:</label>
            <input type="text" id="newCatName" placeholder="مثال: قسم بطاقات الهدايا">
        </div>
        <div class="form-group">
            <label for="newCatIcon">رابط صورة القسم (أيقونة):</label>
            <input type="text" id="newCatIcon" placeholder="ضع رابط صورة أو أيقونة بصيغة https://...">
        </div>
        <button class="btn-main" style="background: #047857; margin-bottom: 25px;" onclick="addNewCategory()">إضافة القسم الجديد</button>

        <h3 style="border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-bottom: 15px;">🛒 إضافة منتج جديد</h3>
        <div class="form-group">
            <label for="pName">اسم المنتج:</label>
            <input type="text" id="pName" placeholder="مثال: شدات ببجي، رويال باس...">
        </div>
        <div class="form-group">
            <label for="pDesc">وصف المنتج:</label>
            <input type="text" id="pDesc" placeholder="تفاصيل المنتج...">
        </div>
        <div class="form-group">
            <label for="pPrice">السعر:</label>
            <input type="text" id="pPrice" placeholder="مثال: $10 أو 10,000 د.ع">
        </div>
        <div class="form-group">
            <label for="pCategory">اختر القسم:</label>
            <select id="pCategorySelect"></select>
        </div>
        <button class="btn-main" onclick="addProduct()">حفظ وإضافة المنتج</button>
    </div>

    <!-- حاوية الأقسام -->
    <div id="sectionsContainer"></div>
</div>

<script>
    // كلمة المرور المطلوبة
    const CORRECT_PASS = "RAEZAR";

    function checkPassword() {
        const inputVal = document.getElementById('adminPassword').value;
        if(inputVal === CORRECT_PASS) {
            document.getElementById('authBox').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
            alert('تم تسجيل الدخول بنجاح لوحة التحكم مفعلة!');
        } else {
            alert('كلمة المرور غير صحيحة! حاول مرة أخرى.');
        }
    }

    // الأقسام الافتراضية
    let categories = JSON.parse(localStorage.getItem('z8_green_categories')) || [
        { id: 'pubg', name: 'ببجي موبايل (PUBG)', icon: 'https://cdn-icons-png.flaticon.com/512/8157/8157128.png' },
        { id: 'discord', name: 'ديسكورد (Discord)', icon: 'https://assets-global.website-files.com/6257adef93867e50d84d30e2/636e0a6a49cf127bf92de1e2_icon_clyde_blurple_RGB.png' },
        { id: 'netflix', name: 'نتفليكس (Netflix)', icon: 'https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg' },
        { id: 'spotify', name: 'سبوتيفاي (Spotify)', icon: 'https://upload.wikimedia.org/wikipedia/commons/1/19/Spotify_logo_without_text.svg' }
    ];

    // المنتجات الافتراضية
    let products = JSON.parse(localStorage.getItem('z8_green_products')) || [];

    function saveAll() {
        localStorage.setItem('z8_green_categories', JSON.stringify(categories));
        localStorage.setItem('z8_green_products', JSON.stringify(products));
        renderAll();
    }

    function addNewCategory() {
        const id = document.getElementById('newCatId').value.trim().toLowerCase();
        const name = document.getElementById('newCatName').value.trim();
        const icon = document.getElementById('newCatIcon').value.trim() || 'https://cdn-icons-png.flaticon.com/512/1170/1170576.png';

        if(!id || !name) {
            alert('الرجاء إدخال معرف القسم واسمه!');
            return;
        }

        // التأكد من عدم تكرار المعرف
        if(categories.some(c => c.id === id)) {
            alert('هذا القسم موجود مسبقاً، اختر معرفاً آخر.');
            return;
        }

        categories.push({ id, name, icon });
        saveAll();

        document.getElementById('newCatId').value = '';
        document.getElementById('newCatName').value = '';
        document.getElementById('newCatIcon').value = '';
        alert('تم إضافة القسم الجديد بنجاح!');
    }

    function addProduct() {
        const name = document.getElementById('pName').value.trim();
        const desc = document.getElementById('pDesc').value.trim();
        const price = document.getElementById('pPrice').value.trim();
        const category = document.getElementById('pCategorySelect').value;

        if(!name || !price) {
            alert('الرجاء إدخال اسم المنتج والسعر!');
            return;
        }

        products.push({ id: Date.now(), name, desc, price, category });
        saveAll();

        document.getElementById('pName').value = '';
        document.getElementById('pDesc').value = '';
        document.getElementById('pPrice').value = '';
    }

    function deleteProduct(id) {
        products = products.filter(p => p.id !== id);
        saveAll();
    }

    function renderAll() {
        // تحديث قائمة الاختيار في لوحة التحكم
        const select = document.getElementById('pCategorySelect');
        select.innerHTML = '';
        categories.forEach(cat => {
            const opt = document.createElement('option');
            opt.value = cat.id;
            opt.textContent = cat.name;
            select.appendChild(opt);
        });

        // بناء الأقسام على الشاشة
        const container = document.getElementById('sectionsContainer');
        container.innerHTML = '';

        categories.forEach(cat => {
            const box = document.createElement('div');
            box.className = 'section-box';
            
            box.innerHTML = `
                <div class="section-header">
                    <img src="${cat.icon}" alt="icon">
                    <h2>${cat.name}</h2>
                </div>
                <div id="cat_${cat.id}" class="products-grid"></div>
            `;
            container.appendChild(box);

            // تعبئة منتجات هذا القسم
            const grid = document.getElementById(`cat_${cat.id}`);
            const catProducts = products.filter(p => p.category === cat.id);

            if(catProducts.length === 0) {
                grid.innerHTML = '<div class="empty-msg">لا توجد منتجات في هذا القسم حالياً</div>';
            } else {
                catProducts.forEach(p => {
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    card.innerHTML = `
                        <div>
                            <div class="product-card-top">
                                <img src="${cat.icon}" alt="icon">
                                <h4>${p.name}</h4>
                            </div>
                            <p>${p.desc || 'لا يوجد وصف'}</p>
                            <div class="product-price">${p.price}</div>
                        </div>
                        <button class="delete-btn" onclick="deleteProduct(${p.id})">حذف المنتج</button>
                    `;
                    grid.appendChild(card);
                });
            }
        });
    }

    // تشغيل العرض عند فتح الصفحة
    renderAll();
</script>

</body>
</html>
