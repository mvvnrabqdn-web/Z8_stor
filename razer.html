<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LA FLAMME - Restaurant & Cafe</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Cairo', sans-serif;
            overflow-x: hidden;
            background-color: #0c0c0c;
            color: #fff;
        }
        .hero-container {
            position: relative;
            width: 100%;
            min-height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.85)), url('https://images.unsplash.com/photo-1544025162-d76694265947?q=80&w=1000&auto=format&fit=crop') no-repeat center center/cover;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px;
            text-align: center;
        }
        
        .brand-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
        }
        .logo-icon {
            font-size: 45px;
            color: #ff4757;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 10px rgba(255, 71, 87, 0.5));
        }
        .brand-title {
            font-family: 'Playfair Display', serif;
            font-size: 38px;
            letter-spacing: 4px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 5px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }
        .brand-subtitle {
            font-size: 14px;
            letter-spacing: 6px;
            color: #dcdde1;
            text-transform: uppercase;
            font-weight: 300;
        }

        .lang-container {
            width: 100%;
            max-width: 350px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin: auto 0;
        }
        .lang-btn {
            width: 100%;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            text-decoration: none;
            display: block;
            text-align: center;
        }
        .lang-btn:hover {
            background: rgba(255, 71, 87, 0.9);
            border-color: #ff4757;
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(255, 71, 87, 0.4);
        }

        .footer-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
        }
        .social-icons {
            display: flex;
            gap: 20px;
        }
        .social-icon {
            width: 45px;
            height: 45px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 18px;
            transition: all 0.3s ease;
            text-decoration: none;
        }
        .social-icon:hover {
            background: #fff;
            color: #000;
            transform: scale(1.1);
        }

        .developer-credit {
            font-size: 13px;
            color: rgba(255, 255, 25, 0.7);
            letter-spacing: 1px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            padding-top: 10px;
            width: 100%;
            max-width: 300px;
            text-align: center;
            color: rgba(255, 25, 255, 0.8);
        }
        .developer-credit span {
            color: #ff4757;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="hero-container">
        <div class="brand-section">
            <div class="logo-icon">
                <i class="fa-solid fa-fire-flame-curved"></i>
            </div>
            <h1 class="brand-title">LA FLAMME</h1>
            <p class="brand-subtitle">Restaurant & Cafe</p>
        </div>

        <!-- أزرار اللغات (استبدل # برابط صفحة كل لغة لديك) -->
        <div class="lang-container">
            <button class="lang-btn" onclick="changeLanguage('en')">English</button>
            <button class="lang-btn" onclick="changeLanguage('tr')">Turkish</button>
            <button class="lang-btn" onclick="changeLanguage('ar')">العربية</button>
        </div>

        <div class="footer-section">
            <div class="social-icons">
                <a href="https://instagram.com" target="_blank" class="social-icon"><i class="fa-brands fa-instagram"></i></a>
                <a href="https://facebook.com" target="_blank" class="social-icon"><i class="fa-brands fa-facebook-f"></i></a>
                <a href="https://maps.google.com" target="_blank" class="social-icon"><i class="fa-solid fa-location-dot"></i></a>
                <a href="tel:+9640000000000" class="social-icon"><i class="fa-solid fa-phone"></i></a>
            </div>
            <div class="developer-credit">
                Designed & Developed by <span>uv_d0</span>
            </div>
        </div>
    </div>

    <script>
        function changeLanguage(lang) {
            // يمكنك هنا توجيه المستخدم لملف المنيو الخاص باللغة المطلوبة
            // مثال: window.location.href = 'menu-' + lang + '.html';
            alert('تم اختيار اللغة: ' + lang);
        }
    </script>
</body>
</html>
