<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z8 Store - المتجر الرقمي</title>
    <style>
        :root {
            --bg-color: #050b07;
            --card-bg: #0b1710;
            --border-color: #132d1d;
            --primary-neon: #00ff66;
            --text-color: #ffffff;
            --text-muted: #8aa895;
            --danger-color: #ef4444;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 15px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        /* الهيدر العلوي */
        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
        }
        .admin-toggle-btn {
            background: transparent;
            color: var(--primary-neon);
            border: 1px solid var(--primary-neon);
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            transition: 0.3s;
        }
        .admin-toggle-btn:hover {
            background: var(--primary-neon);
            color: #000;
        }
        .store-logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo-circle {
            width: 40px;
            height: 40px;
            border: 2px solid var(--primary-neon);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.4);
        }

        /* لوحة التحكم المخفية/ الظاهرة */
        .admin-panel {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 14px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            display: none;
        }
        .admin-panel.active {
            display: block;
        }
        .admin-panel h3 {
            margin-bottom: 15px;
            color: var(--primary-neon);
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: white;
            font-size: 0.95rem;
        }
        .btn-add {
            background: var(--primary-neon);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }

        /* شريط الفلاتر (الأقسام الأفقية) */
        .filters-container {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 20px;
            scrollbar-width: none;
        }
        .filters-container::-webkit-scrollbar {
            display: none;
        }
        .filter-btn {
            background: var(--card-bg);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 0.85rem;
            transition: 0.2s;
        }
        .filter-btn.active {
            background: var(--primary-neon);
            color: #000;
            border-color: var(--primary-neon);
            font-weight: bold;
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.3);
        }

        /* صندوق عرض المنتجات */
        .section-box {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
        }
        .section-title {
            color: var(--primary-neon);
            font-size: 1.1rem;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 15px;
        }
        .product-card {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .product-card h4 {
            font-size: 1.1rem;
            margin-bottom: 6px;
            color: white;
        }
        .product-card p {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 10px;
        }
        .product-price {
            font-weight: bold;
            color: var(--primary-neon);
            margin-bottom: 10px;
            font-size: 1rem;
        }
        .delete-btn {
            background-color: var(--danger-color);
            color: white;
            border: none;
            padding: 6px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .empty-msg {
            color: var(--text-muted);
            text-align: center;
            grid-column: 1 / -1;
            padding: 30px;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- الهيدر العلوي -->
    <div class="top-header">
        <button class="admin-toggle-btn" onclick="toggleAdminPanel()">لوحة التحكم (Admin)</button>
        <div class="store-logo">
            Z8 Store
            <div class="logo-circle"></div>
        </div>
    </div>

    <!-- لوحة التحكم للإضافة (مخفية افتراضياً تفتح بالضغط على الزر) -->
    <div class="admin-panel" id="adminPanel">
        <h3>➕ إضافة منتج جديد</h3>
        <div class="form-group">
            <label>اسم المنتج:</label>
            <input type="text" id="pName" placeholder="أدخل اسم المنتج...">
        </div>
        <div class="form-group">
            <label>وصف المنتج:</label>
            <input type="text" id="pDesc" placeholder="أدخل الوصف...">
        </div>
        <div class="form-group">
            <label>السعر:</label>
            <input type="text" id="pPrice" placeholder="مثال: $10 أو 10,000 د.ع">
        </div>
        <div class="form-group">
            <label>اختر القسم:</label>
            <select id="pCategory">
                <option value="discord">💬 خدمات ديسكورد</option>
                <option value="steam">🎮 حسابات ستيم</option>
                <option value="rainbow">🎯 حسابات رينبو</option>
                <option value="netflix">🎬 حسابات نتفليكس</option>
                <option value="rust">⛺ حسابات راست</option>
                <option value="gta">🚗 حسابات كراند</option>
                <option value="windows">💻 حسابات ويندوز</option>
                <option value="gamepass">🎮 جيم باس</option>
                <option value="fivem">🎙️ فايف أم (إعلانات)</option>
            </select>
        </div>
        <button class="btn-add" onclick="addProduct()">حفظ وإضافة المنتج</button>
    </div>

    <!-- شريط الأقسام والفلاتر الأفقية -->
    <div class="filters-container">
        <button class="filter-btn active" onclick="filterProducts('all', this)">🌐 الكل</button>
        <button class="filter-btn" onclick="filterProducts('discord', this)">💬 خدمات ديسكورد</button>
        <button class="filter-btn" onclick="filterProducts('steam', this)">🎮 حسابات ستيم</button>
        <button class="filter-btn" onclick="filterProducts('rainbow', this)">🎯 حسابات رينبو</button>
        <button class="filter-btn" onclick="filterProducts('netflix', this)">🎬 حسابات نتفليكس</button>
        <button class="filter-btn" onclick="filterProducts('rust', this)">⛺ حسابات راست</button>
        <button class="filter-btn" onclick="filterProducts('gta', this)">🚗 حسابات كراند</button>
        <button class="filter-btn" onclick="filterProducts('windows', this)">💻 حسابات ويندوز</button>
        <button class="filter-btn" onclick="filterProducts('gamepass', this)">🎮 جيم باس</button>
        <button class="filter-btn" onclick="filterProducts('fivem', this)">🎙️ فايف أم (إعلانات)</button>
    </div>

    <!-- عرض المنتجات -->
    <div class="section-box">
        <div class="section-title">
            <span id="currentCategoryTitle">🌐 جميع منتجات وخدمات المتجر</span>
        </div>
        <div id="productsGrid" class="products-grid">
            <div class="empty-msg">لا توجد منتجات مضافة في المتجر حالياً.</div>
        </div>
    </div>
</div>

<script>
    // جلب المنتجات المخزنة مسبقاً بذاكرة المتصفح الدائمة
    let products = JSON.parse(localStorage.getItem('z8_neon_store_products')) || [];
    let currentFilter = 'all';

    function toggleAdminPanel() {
        const panel = document.getElementById('adminPanel');
        panel.classList.toggle('active');
    }

    function saveAndRender() {
        localStorage.setItem('z8_neon_store_products', JSON.stringify(products));
        renderProducts();
    }

    function addProduct() {
        const name = document.getElementById('pName').value.trim();
        const desc = document.getElementById('pDesc').value.trim();
        const price = document.getElementById('pPrice').value.trim();
        const category = document.getElementById('pCategory').value;

        if(!name || !price) {
            alert('الرجاء إدخال اسم المنتج والسعر على الأقل!');
            return;
        }

        const newProduct = {
            id: Date.now(),
            name,
            desc,
            price,
            category
        };

        products.push(newProduct);
        saveAndRender();

        // تفريغ الحقول
        document.getElementById('pName').value = '';
        document.getElementById('pDesc').value = '';
        document.getElementById('pPrice').value = '';
        
        // إغلاق لوحة التحكم بعد الإضافة اختياريًا
        toggleAdminPanel();
    }

    function deleteProduct(id) {
        products = products.filter(p => p.id !== id);
        saveAndRender();
    }

    function filterProducts(category, btnElement) {
        currentFilter = category;
        
        // تغيير الزر النشط
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        btnElement.classList.add('active');

        // تغيير عنوان القسم العلوي بناءً على الاختيار
        document.getElementById('currentCategoryTitle').innerText = btnElement.innerText;

        renderProducts();
    }

    function renderProducts() {
        const grid = document.getElementById('productsGrid');
        grid.innerHTML = '';

        // تصفية المنتجات
        const filteredProducts = currentFilter === 'all' 
            ? products 
            : products.filter(p => p.category === currentFilter);

        if(filteredProducts.length === 0) {
            grid.innerHTML = '<div class="empty-msg">لا توجد منتجات مضافة في المتجر حالياً.</div>';
            return;
        }

        filteredProducts.forEach(p => {
            const card = document.createElement('div');
            card.className = 'product-card';
            card.innerHTML = `
                <div>
                    <h4>${p.name}</h4>
                    <p>${p.desc || 'لا يوجد وصف مضاف'}</p>
                    <div class="product-price">${p.price}</div>
                </div>
                <button class="delete-btn" onclick="deleteProduct(${p.id})">حذف</button>
            `;
            grid.appendChild(card);
        });
    }

    // تشغيل العرض عند تحميل الصفحة
    renderProducts();
</script>

</body>
</html>
