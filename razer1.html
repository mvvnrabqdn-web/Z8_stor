<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة Razer الرسمية</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #1a1a1a;
            --accent-color: #ff073a;
            --accent-glow: rgba(255, 7, 58, 0.6);
            --text-color: #ffffff;
            --text-muted: #aaaaaa;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            text-align: center;
        }

        .page { display: none; padding: 40px 20px; min-height: 100vh; box-sizing: border-box; }
        .active { display: block; }

        /* الأزرار العصرية */
        .btn {
            background: linear-gradient(45deg, #ff073a, #ff4d6d);
            color: white;
            padding: 12px 30px;
            border: none;
            cursor: pointer;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: bold;
            box-shadow: 0 0 15px var(--accent-glow);
            transition: 0.3s;
            margin: 10px;
        }
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px var(--accent-color);
        }
        .btn-secondary { background: #333; box-shadow: none; }
        .btn-secondary:hover { background: #444; box-shadow: 0 0 10px rgba(255,255,255,0.2); }
        .btn-danger { background: #dc3545; box-shadow: 0 0 15px rgba(220,53,69,0.5); }

        input, select {
            padding: 12px;
            margin: 10px;
            width: 90%;
            max-width: 350px;
            background: #222;
            border: 1px solid #444;
            color: white;
            border-radius: 8px;
            font-size: 1rem;
        }
        input:focus { border-color: var(--accent-color); outline: none; }

        /* واحة الترحيب الفخمة */
        #welcomePage {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #1f050b 0%, #0d0d0d 70%);
        }

        .neon-razer {
            color: var(--accent-color);
            font-size: 4rem;
            font-weight: 900;
            text-shadow: 0 0 10px var(--accent-color), 0 0 20px var(--accent-color), 0 0 40px var(--accent-color);
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .welcome-card {
            background: rgba(26, 26, 26, 0.8);
            border: 1px solid rgba(255, 7, 58, 0.3);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 500px;
            width: 100%;
            backdrop-filter: blur(10px);
        }

        /* الموقع الرئيسي */
        header {
            padding: 20px;
            border-bottom: 1px solid #222;
            margin-bottom: 30px;
        }
        .logo-img { max-height: 90px; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 0 15px rgba(0,0,0,0.5); }

        .sections-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        .section-card {
            background: var(--card-bg);
            border: 1px solid #333;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: 0.3s;
        }
        .section-card:hover {
            border-color: var(--accent-color);
            transform: translateY(-5px);
        }
        .section-card img { width: 100%; height: 180px; object-fit: cover; border-radius: 8px; margin-top: 10px; }

        /* لوحة التحكم */
        .dashboard-box {
            background: var(--card-bg);
            border: 1px solid #444;
            padding: 30px;
            border-radius: 15px;
            display: inline-block;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: right;
        }
        .dashboard-box h2, .dashboard-box h3 { color: var(--accent-color); text-align: center; }
    </style>
</head>
<body onload="loadSiteData()">

    <!-- 1. واجهة الترحيب الفخمة -->
    <div id="welcomePage" class="page active">
        <div class="welcome-card">
            <div class="neon-razer">RAZER</div>
            <h2 style="color: #fff; margin-top: 0;">أهلاً بك في عالم الاحتراف</h2>
            <p style="color: var(--text-muted); margin-bottom: 30px;">منصتك الرقمية المتطورة لإدارة وتصميم المشاريع العصرية بأعلى أداء.</p>
            <button class="btn" onclick="goToMain()">دخول إلى المنصة</button>
            <br><br>
            <button class="btn btn-secondary" onclick="showLogin()" style="font-size: 0.9rem; padding: 8px 20px;">لوحة تحكم المشرف</button>
        </div>
    </div>

    <!-- نافذة تسجيل دخول المشرف -->
    <div id="loginPage" class="page" style="display:flex; flex-direction:column; justify-content:center; align-items:center;">
        <div class="welcome-card" style="text-align: center;">
            <h2>تسجيل دخول المشرف</h2>
            <p style="color: var(--text-muted);">أدخل رمز المرور للوصول إلى لوحة التحكم</p>
            <input type="password" id="adminPass" placeholder="كلمة المرور (1234)"><br>
            <button class="btn" onclick="checkPassword()">دخول</button>
            <button class="btn btn-secondary" onclick="goToWelcome()">رجوع</button>
        </div>
    </div>

    <!-- 2. الموقع الرئيسي العصري -->
    <div id="mainPage" class="page">
        <header>
            <img id="displayLogo" src="" alt="شعار Razer" class="logo-img" style="display:none;"><br>
            <div class="neon-razer" style="font-size: 2.5rem;">RAZER</div>
            <p style="color: var(--text-muted);">الموقع الرسمي والخدمات الرقمية</p>
        </header>

        <div style="max-width: 1000px; margin: 0 auto; text-align: right; padding: 0 20px;">
            <h2 style="border-bottom: 2px solid var(--accent-color); display: inline-block; padding-bottom: 5px;">أقسام المنصة</h2>
        </div>
        
        <div id="dynamicSections" class="sections-grid">
            <!-- الأقسام تظهر هنا تلقائياً -->
        </div>

        <div style="margin-top: 50px; padding: 20px;">
            <button class="btn" onclick="showLogin()">لوحة التحكم</button>
            <button class="btn btn-secondary" onclick="goToWelcome()">العودة للترحيب</button>
        </div>
    </div>

    <!-- 3. لوحة التحكم -->
    <div id="dashboardPage" class="page" style="display:flex; flex-direction:column; justify-content:center; align-items:center;">
        <div class="dashboard-box">
            <h2>لوحة التحكم الاحترافية</h2>
            
            <label style="color:var(--text-muted);">تغيير الشعار الرسمي:</label><br>
            <input type="file" id="logoInput" accept="image/*"><br>
            <button class="btn" onclick="updateLogo()" style="width: 100%;">حفظ الشعار</button>

            <hr style="border: 0; border-top: 1px solid #444; margin: 20px 0;">

            <label style="color:var(--text-muted);">إضافة قسم جديد:</label><br>
            <input type="text" id="sectionTitle" placeholder="عنوان القسم"><br>
            <input type="file" id="sectionImage" accept="image/*"><br>
            <button class="btn" onclick="addNewSection()" style="width: 100%;">إضافة القسم للموقع</button>
            
            <hr style="border: 0; border-top: 1px solid #444; margin: 20px 0;">
            
            <button class="btn btn-danger" onclick="clearData()" style="width: 100%; margin-bottom: 10px;">تصفير ومسح ذاكرة الموقع</button>
            <button class="btn btn-secondary" onclick="goToMain()" style="width: 100%; margin: 0;">الخروج إلى الموقع</button>
        </div>
    </div>

    <script>
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            window.scrollTo(0, 0);
        }

        function goToWelcome() { showPage('welcomePage'); }
        function goToMain() { showPage('mainPage'); }
        function showLogin() { showPage('loginPage'); }

        function checkPassword() {
            let pass = document.getElementById('adminPass').value;
            if (pass === "1234") {
                showPage('dashboardPage');
                document.getElementById('adminPass').value = "";
            } else {
                alert("كلمة المرور غير صحيحة!");
            }
        }

        function loadSiteData() {
            let savedLogo = localStorage.getItem('razer_pro_logo');
            if (savedLogo) {
                let logoImg = document.getElementById('displayLogo');
                logoImg.src = savedLogo;
                logoImg.style.display = 'inline-block';
            }

            let savedSections = JSON.parse(localStorage.getItem('razer_pro_sections')) || [];
            let container = document.getElementById('dynamicSections');
            container.innerHTML = "";
            
            if(savedSections.length === 0) {
                container.innerHTML = `<p style="grid-column: 1/-1; color: #777;">لا توجد أقسام مضافة حالياً. استخدم لوحة التحكم لإضافة أقسام جديدة.</p>`;
                return;
            }

            savedSections.forEach(sec => {
                let sectionDiv = document.createElement('div');
                sectionDiv.className = "section-card";
                sectionDiv.innerHTML = `
                    <h3 style="margin-top:0; color:#fff;">${sec.title}</h3>
                    ${sec.image ? `<img src="${sec.image}" alt="صورة القسم">` : ''}
                `;
                container.appendChild(sectionDiv);
            });
        }

        function updateLogo() {
            let fileInput = document.getElementById('logoInput');
            if (fileInput.files && fileInput.files[0]) {
                let reader = new FileReader();
                reader.onload = function(e) {
                    localStorage.setItem('razer_pro_logo', e.target.result);
                    loadSiteData();
                    alert("تم تحديث الشعار بنجاح!");
                }
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                alert("الرجاء اختيار صورة للشعار أولاً!");
            }
        }

        function addNewSection() {
            let title = document.getElementById('sectionTitle').value;
            let fileInput = document.getElementById('sectionImage');
            
            if(!title) {
                alert("الرجاء كتابة عنوان القسم على الأقل");
                return;
            }

            let savedSections = JSON.parse(localStorage.getItem('razer_pro_sections')) || [];

            if (fileInput.files && fileInput.files[0]) {
                let reader = new FileReader();
                reader.onload = function(e) {
                    savedSections.push({ title: title, image: e.target.result });
                    localStorage.setItem('razer_pro_sections', JSON.stringify(savedSections));
                    document.getElementById('sectionTitle').value = "";
                    fileInput.value = "";
                    loadSiteData();
                    alert("تم إضافة القسم بنجاح!");
                }
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                savedSections.push({ title: title, image: "" });
                localStorage.setItem('razer_pro_sections', JSON.stringify(savedSections));
                document.getElementById('sectionTitle').value = "";
                loadSiteData();
                alert("تم إضافة القسم بنجاح!");
            }
        }

        function clearData() {
            if(confirm("هل أنت متأكد من مسح كافة بيانات الموقع والشعار؟")) {
                localStorage.removeItem('razer_pro_logo');
                localStorage.removeItem('razer_pro_sections');
                loadSiteData();
                alert("تمت استعادة الإعدادات الأصلية بنجاح.");
            }
        }
    </script>
</body>
</html>
