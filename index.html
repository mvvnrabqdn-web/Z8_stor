<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z8 Store</title>
    <style>
        body {
            background-color: #050b07;
            color: #ffffff;
            font-family: Tahoma, sans-serif;
            padding: 15px;
            margin: 0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0b1710;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #132d1d;
            margin-bottom: 15px;
        }
        button {
            background: #00ff66;
            color: #000;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        .admin-panel {
            background: #0b1710;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #132d1d;
            margin-bottom: 15px;
            display: none;
        }
        .admin-panel.show {
            display: block;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin: 5px 0 12px 0;
            background: #050b07;
            border: 1px solid #132d1d;
            color: white;
            border-radius: 6px;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
        }
        .product-card {
            background: #0b1710;
            border: 1px solid #132d1d;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }
        .product-card h4 {
            margin: 5px 0;
            color: #fff;
        }
        .price {
            color: #00ff66;
            font-weight: bold;
        }
        .delete-btn {
            background: #ef4444;
            color: white;
            padding: 5px 10px;
            font-size: 0.8rem;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Z8 Store</h2>
        <button onclick="toggleAdmin()">إفتح / أغلق لوحة التحكم</button>
    </div>

    <!-- لوحة التحكم -->
    <div class="admin-panel" id="adminPanel">
        <h3 style="color: #00ff66; margin-top: 0;">لوحة التحكم البسيطة</h3>
        
        <label>اسم المنتج:</label>
        <input type="text" id="pName" placeholder="أدخل اسم المنتج">

        <label>السعر:</label>
        <input type="text" id="pPrice" placeholder="أدخل السعر">

        <button onclick="addProduct()" style="width: 100%;">إضافة المنتج للمتجر</button>
    </div>

    <!-- عرض المنتجات -->
    <h3>منتجات المتجر</h3>
    <div class="products-grid" id="productsGrid">
        <div style="color: #8aa895;">لا توجد منتجات حالياً.</div>
    </div>
</div>

<script>
    // مصفوفة تخزين المنتجات مباشرة داخل الذاكرة المؤقتة للتشغيل السريع
    let products = [];

    function toggleAdmin() {
        const panel = document.getElementById('adminPanel');
        // تبديل حالة الظهور بشكل مباشر وقاطع
        if (panel.style.display === 'block') {
            panel.style.display = 'none';
        } else {
            panel.style.display = 'block';
        }
    }

    function addProduct() {
        const name = document.getElementById('pName').value.trim();
        const price = document.getElementById('pPrice').value.trim();

        if (!name || !price) {
            alert('الرجاء كتابة اسم المنتج والسعر!');
            return;
        }

        const product = {
            id: Date.now(),
            name: name,
            price: price
        };

        products.push(product);
        renderProducts();

        // تفريغ الحقول
        document.getElementById('pName').value = '';
        document.getElementById('pPrice').value = '';
        alert('تمت الإضافة بنجاح!');
    }

    function deleteProduct(id) {
        products = products.filter(p => p.id !== id);
        renderProducts();
    }

    function renderProducts() {
        const grid = document.getElementById('productsGrid');
        grid.innerHTML = '';

        if (products.length === 0) {
            grid.innerHTML = '<div style="color: #8aa895;">لا توجد منتجات حالياً.</div>';
            return;
        }

        products.forEach(p => {
            const card = document.createElement('div');
            card.className = 'product-card';
            card.innerHTML = `
                <h4>${p.name}</h4>
                <div class="price">${p.price}</div>
                <button class="delete-btn" onclick="deleteProduct(${p.id})">حذف</button>
            `;
            grid.appendChild(card);
        });
    }
</script>

</body>
</html>
