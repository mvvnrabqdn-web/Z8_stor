<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z8 Store - المتجر الرسمي</title>
    <style>
        :root {
            --bg-color: #0b0f0d;
            --card-bg: #121c15;
            --accent-color: #32cd32;
            --accent-glow: rgba(50, 205, 50, 0.4);
            --text-color: #ffffff;
            --text-muted: #b0c4de;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            text-align: center;
        }

        .page { display: none; padding: 40px 20px; min-height: 100vh; box-sizing: border-box; }
        .active { display: block; }

        /* الأزرار العصرية */
        .btn {
            background: linear-gradient(45deg, #228b22, #32cd32);
            color: white;
            padding: 12px 30px;
            border: none;
            cursor: pointer;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: bold;
            box-shadow: 0 0 15px var(--accent-glow);
            transition: 0.3s;
            margin: 10px;
        }
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(50, 205, 50, 0.8);
        }
        .btn-secondary { background: #222; box-shadow: none; border: 1px solid #444; }
        .btn-secondary:hover { background: #333; }
        .btn-danger { background: #dc3545; box-shadow: 0 0 15px rgba(220,53,69,0.5); }

        input, select {
            padding: 12px;
            margin: 10px;
            width: 90%;
            max-width: 350px;
            background: #1a1a1a;
            border: 1px solid #444;
            color: white;
            border-radius: 8px;
            font-size: 1rem;
        }
        input:focus { border-color: var(--accent-color); outline: none; }

        /* واجهة الترحيب والشعار */
        #welcomePage {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .welcome-card {
            background: var(--card-bg);
            border: 2px solid var(--accent-color);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 0 30px var(--accent-glow);
            max-width: 450px;
            width: 90%;
        }

        .logo-container {
            width: 140px;
            height: 140px;
            margin: 0 auto 20px auto;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid var(--accent-color);
            box-shadow: 0 0 20px rgba(50, 205, 50, 0.5);
            background: #000;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 { color: var(--accent-color); font-size: 1.8rem; margin-bottom: 10px; text-shadow: 0 0 10px var(--accent-glow); }
        p { color: var(--text-muted); font-size: 1.1rem; margin-bottom: 25px; }

        /* الموقع الرئيسي */
        header { padding: 20px; border-bottom: 1px solid #222; margin-bottom: 30px; }
        .sections-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        .section-card {
            background: var(--card-bg);
            border: 1px solid #333;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: 0.3s;
        }
        .section-card:hover { border-color: var(--accent-color); transform: translateY(-5px); }
        .section-card img { width: 100%; height: 180px; object-fit: cover; border-radius: 8px; margin-top: 10px; }

        /* لوحة التحكم */
        .dashboard-box {
            background: var(--card-bg);
            border: 1px solid #444;
            padding: 30px;
            border-radius: 15px;
            display: inline-block;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: right;
        }
        .dashboard-box h2, .dashboard-box h3 { color: var(--accent-color); text-align: center; }
    </style>
</head>
<body onload="loadSiteData()">

    <!-- 1. واجهة الترحيب والشعار -->
    <div id="welcomePage" class="page active">
        <div class="welcome-card">
            <div class="logo-container">
                <img id="welcomeLogoImg" src="" alt="شعار المتجر">
            </div>
            <h1>أهلاً بك في متجرنا</h1>
            <p>نورت المتجر، تابع أحدث المنتجات والعروض الحصرية معنا.</p>
            <button class="btn" onclick="goToMain()">دخول إلى المتجر</button>
            <br>
            <button class="btn btn-secondary" onclick="showLogin()" style="font-size: 0.85rem; padding: 8px 20px; margin-top: 15px;">لوحة تحكم المشرف</button>
        </div>
    </div>

    <!-- نافذة تسجيل دخول المشرف -->
    <div id="loginPage" class="page" style="display:flex; flex-direction:column; justify-content:center; align-items:center;">
        <div class="welcome-card" style="text-align: center;">
            <h2>تسجيل دخول المشرف</h2>
            <p>أدخل رمز المرور (1234)</p>
            <input type="password" id="adminPass" placeholder="كلمة المرور"><br>
            <button class="btn" onclick="checkPassword()">دخول</button>
            <button class="btn btn-secondary" onclick="goToWelcome()">رجوع</button>
        </div>
    </div>

    <!-- 2. المتجر الرئيسي والأقسام -->
    <div id="mainPage" class="page">
        <header>
            <div class="logo-container" style="width: 100px; height: 100px; margin-bottom: 10px;">
                <img id="mainLogoImg" src="" alt="شعار المتجر">
            </div>
            <h1>Z8 Store</h1>
            <p>المتجر الرسمي والخدمات الرقمية</p>
        </header>

        <div style="max-width: 1000px; margin: 0 auto; text-align: right; padding: 0 20px;">
            <h2 style="border-bottom: 2px solid var(--accent-color); display: inline-block; padding-bottom: 5px;">أقسام المتجر</h2>
        </div>
        
        <div id="dynamicSections" class="sections-grid">
            <!-- الأقسام المضافة تظهر هنا -->
        </div>

        <div style="margin-top: 50px; padding: 20px;">
            <button class="btn" onclick="showLogin()">لوحة التحكم</button>
            <button class="btn btn-secondary" onclick="goToWelcome()">العودة للترحيب</button>
        </div>
    </div>

    <!-- 3. لوحة التحكم لإدارة الأقسام والشعار -->
    <div id="dashboardPage" class="page" style="display:flex; flex-direction:column; justify-content:center; align-items:center;">
        <div class="dashboard-box">
            <h2>لوحة التحكم</h2>
            
            <label style="color:var(--text-muted);">تغيير الشعار الدائري:</label><br>
            <input type="file" id="logoInput" accept="image/*"><br>
            <button class="btn" onclick="updateLogo()" style="width: 100%;">حفظ الشعار الجديد</button>

            <hr style="border: 0; border-top: 1px solid #444; margin: 20px 0;">

            <label style="color:var(--text-muted);">إضافة قسم/منتج جديد:</label><br>
            <input type="text" id="sectionTitle" placeholder="اسم القسم أو المنتج"><br>
            <input type="file" id="sectionImage" accept="image/*"><br>
            <button class="btn" onclick="addNewSection()" style="width: 100%;">إضافة للمتجر</button>
            
            <hr style="border: 0; border-top: 1px solid #444; margin: 20px 0;">
            
            <button class="btn btn-danger" onclick="clearData()" style="width: 100%; margin-bottom: 10px;">إعادة ضبط المصنع (مسح الكل)</button>
            <button class="btn btn-secondary" onclick="goToMain()" style="width: 100%; margin: 0;">الخروج إلى المتجر</button>
        </div>
    </div>

    <script>
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            window.scrollTo(0, 0);
        }

        function goToWelcome() { showPage('welcomePage'); }
        function goToMain() { showPage('mainPage'); }
        function showLogin() { showPage('loginPage'); }

        function checkPassword() {
            let pass = document.getElementById('adminPass').value;
            if (pass === "1234") {
                showPage('dashboardPage');
                document.getElementById('adminPass').value = "";
            } else {
                alert("كلمة المرور غير صحيحة!");
            }
        }

        function loadSiteData() {
            // الشعار الافتراضي الدائري المتناسق
            let defaultLogo = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAPAAAADwCAYAAAA+VemSAAAACXBIWXMAAAsTAAALEwEAmpwYAAAgAElEQVR4nO2deXxU1f3HPy8lD5C9W3YQEQVBXBEUFBFUEFGlrVpRa7XatWq1av3+1VprtaLVKipCUVxAVBEkEED2BSEsyW7fC2TIc++P803g50JmMoRz+vV6vbe959z7zL1z733n3nNmXo/IUu1/Mvcfc26j9j8ZzPZq/x9D5b8pQ21Z9r3p/P8fG9gB1eXvI6tWnEAAAABJRU5ErkJggg==";
            let savedLogo = localStorage.getItem('z8_store_logo') || defaultLogo;
            
            document.getElementById('welcomeLogoImg').src = savedLogo;
            document.getElementById('mainLogoImg').src = savedLogo;

            let savedSections = JSON.parse(localStorage.getItem('z8_store_sections')) || [];
            let container = document.getElementById('dynamicSections');
            container.innerHTML = "";
            
            if(savedSections.length === 0) {
                container.innerHTML = `<p style="grid-column: 1/-1; color: #777;">لا توجد أقسام مضافة حالياً. استخدم لوحة التحكم لإضافة أقسام جديدة للمتجر.</p>`;
                return;
            }

            savedSections.forEach(sec => {
                let sectionDiv = document.createElement('div');
                sectionDiv.className = "section-card";
                sectionDiv.innerHTML = `
                    <h3 style="margin-top:0; color:#fff;">${sec.title}</h3>
                    ${sec.image ? `<img src="${sec.image}" alt="صورة القسم">` : ''}
                `;
                container.appendChild(sectionDiv);
            });
        }

        function updateLogo() {
            let fileInput = document.getElementById('logoInput');
            if (fileInput.files && fileInput.files[0]) {
                let reader = new FileReader();
                reader.onload = function(e) {
                    localStorage.setItem('z8_store_logo', e.target.result);
                    loadSiteData();
                    alert("تم تحديث الشعار بنجاح!");
                }
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                alert("الرجاء اختيار صورة للشعار أولاً!");
            }
        }

        function addNewSection() {
            let title = document.getElementById('sectionTitle').value;
            let fileInput = document.getElementById('sectionImage');
            
            if(!title) {
                alert("الرجاء كتابة اسم القسم أو المنتج على الأقل");
                return;
            }

            let savedSections = JSON.parse(localStorage.getItem('z8_store_sections')) || [];

            if (fileInput.files && fileInput.files[0]) {
                let reader = new FileReader();
                reader.onload = function(e) {
                    savedSections.push({ title: title, image: e.target.result });
                    localStorage.setItem('z8_store_sections', JSON.stringify(savedSections));
                    document.getElementById('sectionTitle').value = "";
                    fileInput.value = "";
                    loadSiteData();
                    alert("تم إضافة القسم للمتجر بنجاح!");
                }
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                savedSections.push({ title: title, image: "" });
                localStorage.setItem('z8_store_sections', JSON.stringify(savedSections));
                document.getElementById('sectionTitle').value = "";
                loadSiteData();
                alert("تم إضافة القسم للمتجر بنجاح!");
            }
        }

        function clearData() {
            if(confirm("هل أنت متأكد من مسح كافة أقسام المتجر واستعادة الإعدادات الأصلية؟")) {
                localStorage.removeItem('z8_store_logo');
                localStorage.removeItem('z8_store_sections');
                loadSiteData();
                alert("تمت إعادة التعيين بنجاح.");
            }
        }
    </script>
</body>
</html>
