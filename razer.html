<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Grill - قائمة الطعام</title>
    <style>
        :root {
            --primary-color: #e67e22;
            --dark-color: #2c3e50;
            --bg-color: #f9f9f9;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            color: #333;
        }
        header {
            background-color: var(--dark-color);
            color: white;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .menu-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }
        .menu-item h3 {
            margin: 0 0 5px 0;
            color: var(--dark-color);
        }
        .price {
            color: var(--primary-color);
            font-weight: bold;
        }
        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            opacity: 0.9;
        }
        /* قسم السلة والخصم */
        .cart-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px dashed #ddd;
        }
        .cart-items {
            list-style: none;
            padding: 0;
        }
        .cart-items li {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .discount-box {
            display: flex;
            gap: 10px;
            margin: 15px 0;
        }
        .discount-box input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
            flex: 1;
        }
        .total-section {
            font-size: 1.2rem;
            font-weight: bold;
            text-align: left;
            margin-top: 15px;
        }
        .developer-credit {
            text-align: center;
            margin-top: 40px;
            font-size: 0.9rem;
            color: #7f8c8d;
        }
    </style>
</head>
<body>

    <header>
        <h1>Royal Grill</h1>
        <p>أهلاً بكم في مطعمنا - تلذذ بأفضل الأطباق</p>
    </header>

    <div class="container">
        <h2>قائمة الطعام</h2>
        
        <!-- عناصر القائمة -->
        <div class="menu-item">
            <div>
                <h3>وجبة برجر مشوي</h3>
                <p>برجر لحم بقري مع الصوص الخاص</p>
            </div>
            <div>
                <span class="price">8.50 $</span>
                <button onclick="addToCart('برجر مشوي', 8.50)">إضافة للسلة</button>
            </div>
        </div>

        <div class="menu-item">
            <div>
                <h3>بيتزا مأكولات بحرية</h3>
                <p>جبنة موزاريلا، روبيان، وكاليماري</p>
            </div>
            <div>
                <span class="price">12.00 $</span>
                <button onclick="addToCart('بيتزا مأكولات بحرية', 12.00)">إضافة للسلة</button>
            </div>
        </div>

        <!-- قسم سلة الطلبات والخصم -->
        <div class="cart-section">
            <h2>سلة الطلبات</h2>
            <ul id="cartList" class="cart-items">
                <p>السلة فارغة حالياً.</p>
            </ul>

            <!-- إدخال كود الخصم -->
            <div class="discount-box">
                <input type="text" id="discountInput" placeholder="أدخل كود الخصم (مثال: ROYAL20)">
                <button onclick="applyDiscount()">تطبيق الخصم</button>
            </div>
            <p id="discountMessage" style="color: green; font-size: 0.9rem;"></p>

            <div class="total-section">
                المجموع الكلي: <span id="totalPrice">0.00</span> $
            </div>
        </div>

        <div class="developer-credit">
            تم التطوير بواسطة: <a href="https://instagram.com/uv_d0" target="_blank">@uv_d0</a>
        </div>
    </div>

    <script>
        let cart = [];
        let discountRate = 0; // نسبة الخصم الافتراضية

        function addToCart(name, price) {
            cart.push({ name, price });
            updateCartUI();
        }

        function updateCartUI() {
            const cartList = document.getElementById('cartList');
            const totalPriceEl = document.getElementById('totalPrice');
            
            if (cart.length === 0) {
                cartList.innerHTML = '<p>السلة فارغة حالياً.</p>';
                totalPriceEl.textContent = '0.00';
                return;
            }

            cartList.innerHTML = '';
            let subtotal = 0;

            cart.forEach((item, index) => {
                subtotal += item.price;
                cartList.innerHTML += `<li><span>${item.name}</span> <span>${item.price.toFixed(2)} $</span></li>`;
            });

            // حساب السعر بعد الخصم
            let finalTotal = subtotal - (subtotal * discountRate);
            totalPriceEl.textContent = finalTotal.toFixed(2);
        }

        function applyDiscount() {
            const code = document.getElementById('discountInput').value.trim();
            const messageEl = document.getElementById('discountMessage');

            // الأكواد المعتمدة للخصم (يمكنك تعديلها أو ربطها بقاعدة بيانات لاحقاً)
            if (code === 'ROYAL20') {
                discountRate = 0.20; // خصم 20%
                messageEl.style.color = 'green';
                messageEl.textContent = 'تم تطبيق خصم 20% بنجاح!';
            } else if (code === 'ROYAL50') {
                discountRate = 0.50; // خصم 50%
                messageEl.style.color = 'green';
                messageEl.textContent = 'تم تطبيق خصم 50% بنجاح!';
            } else {
                discountRate = 0;
                messageEl.style.color = 'red';
                messageEl.textContent = 'كود الخصم غير صحيح!';
            }

            updateCartUI();
        }
    </script>

</body>
</html>
