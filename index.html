<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z8 Store - المتجر الرقمي المتكامل</title>
    <style>
        :root {
            --bg-color: #050b07;
            --card-bg: #0b1710;
            --border-color: #132d1d;
            --primary-neon: #00ff66;
            --text-color: #ffffff;
            --text-muted: #8aa895;
            --danger-color: #ef4444;
            --success-color: #10b981;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 15px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        /* الهيدر العلوي */
        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
        }
        .admin-toggle-btn {
            background: transparent;
            color: var(--primary-neon);
            border: 1px solid var(--primary-neon);
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            transition: 0.3s;
        }
        .admin-toggle-btn:hover {
            background: var(--primary-neon);
            color: #000;
        }
        .store-logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo-circle {
            width: 45px;
            height: 45px;
            border: 2px solid var(--primary-neon);
            border-radius: 50%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.4);
        }
        .logo-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* لوحة التحكم */
        .admin-panel {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 14px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            display: none;
        }
        .admin-panel.active {
            display: block;
        }
        .admin-panel h3 {
            margin-bottom: 15px;
            color: var(--primary-neon);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: white;
            font-size: 0.95rem;
        }
        .form-group input[type="file"] {
            padding: 7px;
            cursor: pointer;
        }
        .btn-add {
            background: var(--primary-neon);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-top: 5px;
        }

        /* إدارة الحذف السريع */
        .admin-products-list {
            margin-top: 20px;
            max-height: 200px;
            overflow-y: auto;
            border-top: 1px solid var(--border-color);
            padding-top: 10px;
        }
        .admin-product-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-color);
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            border: 1px solid var(--border-color);
            font-size: 0.9rem;
        }

        /* شريط الأقسام والفلاتر الأفقية */
        .filters-container {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 20px;
            scrollbar-width: none;
        }
        .filters-container::-webkit-scrollbar {
            display: none;
        }
        .filter-btn {
            background: var(--card-bg);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 0.85rem;
            transition: 0.2s;
        }
        .filter-btn.active {
            background: var(--primary-neon);
            color: #000;
            border-color: var(--primary-neon);
            font-weight: bold;
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.3);
        }

        /* صندوق عرض المنتجات */
        .section-box {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
        }
        .section-title {
            color: var(--primary-neon);
            font-size: 1.1rem;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 15px;
        }
        .product-card {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }
        .product-img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 10px;
            background: #111;
        }
        .product-card h4 {
            font-size: 1.1rem;
            margin-bottom: 6px;
            color: white;
        }
        .product-card p {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 10px;
        }
        .product-price {
            font-weight: bold;
            color: var(--primary-neon);
            margin-bottom: 8px;
            font-size: 1rem;
        }
        /* بادج الحالة (متوفر / غير متوفر) */
        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .status-available {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
            border: 1px solid #10b981;
        }
        .status-unavailable {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: 1px solid #ef4444;
        }
        .delete-btn {
            background-color: var(--danger-color);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .empty-msg {
            color: var(--text-muted);
            text-align: center;
            grid-column: 1 / -1;
            padding: 30px;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- الهيدر العلوي -->
    <div class="top-header">
        <button class="admin-toggle-btn" onclick="checkAdminPassword()">لوحة التحكم (Admin)</button>
        <div class="store-logo">
            <span id="storeTitleText">Z8 Store</span>
            <div class="logo-circle" id="logoCircleContainer">
                <span style="font-size: 10px; color: var(--primary-neon);">Z8</span>
            </div>
        </div>
    </div>

    <!-- لوحة التحكم المحمية -->
    <div class="admin-panel" id="adminPanel">
        <h3>⚙️ إعدادات المتجر الشاملة</h3>
        
        <div class="form-group" style="margin-top: 15px;">
            <label>اختر شعار المتجر من الاستديو:</label>
            <input type="file" id="storeLogoFile" accept="image/*" onchange="updateStoreLogoFromFile(event)">
        </div>

        <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 20px 0;">

        <h3>➕ إضافة قسم جديد للمتجر</h3>
        <div class="form-group">
            <label>اسم القسم الجديد (مثال: حسابات نتفليكس، روبلوكس...):</label>
            <input type="text" id="newCategoryName" placeholder="اكتب اسم القسم...">
        </div>
        <button class="btn-add" style="background: #3b82f6; color: white;" onclick="addNewCategory()">إضافة القسم الجديد</button>

        <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 20px 0;">

        <h3>➕ إضافة منتج جديد</h3>
        <div class="form-group">
            <label>اسم المنتج:</label>
            <input type="text" id="pName" placeholder="أدخل اسم المنتج...">
        </div>
        <div class="form-group">
            <label>وصف المنتج:</label>
            <input type="text" id="pDesc" placeholder="أدخل الوصف...">
        </div>
        <div class="form-group">
            <label>السعر:</label>
            <input type="text" id="pPrice" placeholder="مثال: $10 أو 10,000 د.ع">
        </div>
        <div class="form-group">
            <label>صورة المنتج (من الاستديو):</label>
            <input type="file" id="pImageFile" accept="image/*">
        </div>
        <div class="form-group">
            <label>اختر القسم:</label>
            <select id="pCategorySelect">
                <!-- الأقسام تتعبى تلقائياً -->
            </select>
        </div>
        <div class="form-group">
            <label>حالة المنتج:</label>
            <select id="pStatusSelect">
                <option value="available">🟢 متوفر</option>
                <option value="unavailable">🔴 غير متوفر</option>
            </select>
        </div>
        <button class="btn-add" onclick="processAddProduct()">حفظ وإضافة المنتج</button>

        <h3 style="margin-top: 25px;">🗑️ إدارة وحذف المنتجات</h3>
        <div class="admin-products-list" id="adminProductsList">
            <!-- قائمة الحذف السريع -->
        </div>
    </div>

    <!-- شريط الأقسام والفلاتر الأفقية -->
    <div class="filters-container" id="filtersContainer">
        <!-- الأقسام تتعبى تلقائياً -->
    </div>

    <!-- عرض المنتجات للزبائن -->
    <div class="section-box">
        <div class="section-title" id="currentCategoryTitle">🌐 جميع منتجات وخدمات المتجر</div>
        <div id="productsGrid" class="products-grid">
            <div class="empty-msg">لا توجد منتجات مضافة في المتجر حالياً.</div>
        </div>
    </div>
</div>

<script>
    const ADMIN_PASSWORD = "1234";

    // جلب البيانات أو التهيئة الأولية للأقسام الافتراضية
    let categories = JSON.parse(localStorage.getItem('z8_store_categories')) || [
        { id: 'discord', name: '💬 خدمات ديسكورد' },
        { id: 'steam', name: '🎮 حسابات ستيم' },
        { id: 'rainbow', name: '🎯 حسابات رينبو' },
        { id: 'netflix', name: '🎬 حسابات نتفليكس' },
        { id: 'rust', name: '⛺ حسابات راست' },
        { id: 'gta', name: '🚗 حسابات كراند' },
        { id: 'windows', name: '💻 حسابات ويندوز' },
        { id: 'gamepass', name: '🎮 جيم باس' },
        { id: 'fivem', name: '🎙️ فايف أم (إعلانات)' }
    ];

    let products = JSON.parse(localStorage.getItem('z8_store_gallery_products')) || [];
    let customLogo = localStorage.getItem('z8_store_gallery_logo') || '';
    let currentFilter = 'all';

    if(customLogo) {
        document.getElementById('logoCircleContainer').innerHTML = `<img src="${customLogo}" alt="Logo">`;
    }

    function checkAdminPassword() {
        const pass = prompt("الرجاء إدخال كلمة مرور لوحة التحكم:");
        if(pass === ADMIN_PASSWORD) {
            const panel = document.getElementById('adminPanel');
            panel.classList.toggle('active');
            renderAdminProductsList();
            renderCategoryOptions();
        } else if(pass !== null) {
            alert("كلمة المرور غير صحيحة!");
        }
    }

    function updateStoreLogoFromFile(event) {
        const file = event.target.files[0];
        if (file) {
            compressImage(file, 300, 300, 0.7, function(compressedData) {
                customLogo = compressedData;
                localStorage.setItem('z8_store_gallery_logo', customLogo);
                document.getElementById('logoCircleContainer').innerHTML = `<img src="${customLogo}" alt="Logo">`;
                alert("تم تحديث شعار المتجر بنجاح!");
            });
        }
    }

    function addNewCategory() {
        const nameInput = document.getElementById('newCategoryName');
        const name = nameInput.value.trim();
        if(!name) {
            alert('الرجاء كتابة اسم القسم الجديد!');
            return;
        }

        const newId = 'cat_' + Date.now();
        categories.push({ id: newId, name: name });
        localStorage.setItem('z8_store_categories', JSON.stringify(categories));

        nameInput.value = '';
        renderCategoriesUI();
        renderCategoryOptions();
        alert('تم إضافة القسم بنجاح!');
    }

    function renderCategoriesUI() {
        const container = document.getElementById('filtersContainer');
        container.innerHTML = `<button class="filter-btn ${currentFilter === 'all' ? 'active' : ''}" onclick="filterProducts('all', this)">🌐 الكل</button>`;

        categories.forEach(cat => {
            const isActive = currentFilter === cat.id ? 'active' : '';
            container.innerHTML += `<button class="filter-btn ${isActive}" onclick="filterProducts('${cat.id}', this)">${cat.name}</button>`;
        });
    }

    function renderCategoryOptions() {
        const select = document.getElementById('pCategorySelect');
        select.innerHTML = '';
        categories.forEach(cat => {
            select.innerHTML += `<option value="${cat.id}">${cat.name}</option>`;
        });
    }

    // دالة لضغط الصور لتجنب امتلاء الذاكرة الدائمة
    function compressImage(file, maxWidth, maxHeight, quality, callback) {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = function (event) {
            const img = new Image();
            img.src = event.target.result;
            img.onload = function () {
                let canvas = document.createElement('canvas');
                let width = img.width;
                let height = img.height;

                if (width > height) {
                    if (width > maxWidth) {
                        height *= maxWidth / width;
                        width = maxWidth;
                    }
                } else {
                    if (height > maxHeight) {
                        width *= maxHeight / height;
                        height = maxHeight;
                    }
                }

                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                callback(canvas.toDataURL('image/jpeg', quality));
            };
        };
    }

    function saveAndRender() {
        localStorage.setItem('z8_store_gallery_products', JSON.stringify(products));
        renderProducts();
        renderAdminProductsList();
    }

    function processAddProduct() {
        const name = document.getElementById('pName').value.trim();
        const desc = document.getElementById('pDesc').value.trim();
        const price = document.getElementById('pPrice').value.trim();
        const category = document.getElementById('pCategorySelect').value;
        const status = document.getElementById('pStatusSelect').value;
        const fileInput = document.getElementById('pImageFile');

        if(!name || !price) {
            alert('الرجاء إدخال اسم المنتج والسعر على الأقل!');
            return;
        }

        if (fileInput.files && fileInput.files[0]) {
            compressImage(fileInput.files[0], 500, 500, 0.7, function(compressedImgData) {
                saveNewProduct(name, desc, price, category, status, compressedImgData);
            });
        } else {
            saveNewProduct(name, desc, price, category, status, '');
        }
    }

    function saveNewProduct(name, desc, price, category, status, img) {
        const newProduct = {
            id: Date.now(),
            name,
            desc,
            price,
            category,
            status,
            img
        };

        products.push(newProduct);
        saveAndRender();

        document.getElementById('pName').value = '';
        document.getElementById('pDesc').value = '';
        document.getElementById('pPrice').value = '';
        document.getElementById('pImageFile').value = '';
        alert("تم إضافة المنتج بنجاح!");
    }

    function deleteProduct(id) {
        if(confirm("هل أنت متأكد من حذف هذا المنتج؟")) {
            products = products.filter(p => p.id !== id);
            saveAndRender();
        }
    }

    function filterProducts(category, btnElement) {
        currentFilter = category;
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        btnElement.classList.add('active');
        document.getElementById('currentCategoryTitle').innerText = btnElement.innerText;
        renderProducts();
    }

    function renderProducts() {
        const grid = document.getElementById('productsGrid');
        grid.innerHTML = '';

        const filteredProducts = currentFilter === 'all' 
            ? products 
            : products.filter(p => p.category === currentFilter);

        if(filteredProducts.length === 0) {
            grid.innerHTML = '<div class="empty-msg">لا توجد منتجات مضافة في المتجر حالياً.</div>';
            return;
        }

        filteredProducts.forEach(p => {
            const card = document.createElement('div');
            card.className = 'product-card';
            
            let imgTag = p.img ? `<img src="${p.img}" class="product-img" alt="${p.name}">` : '';
            let statusBadge = p.status === 'unavailable' 
                ? `<div class="status-badge status-unavailable">🔴 غير متوفر</div>` 
                : `<div class="status-badge status-available">🟢 متوفر</div>`;

            card.innerHTML = `
                <div>
                    ${imgTag}
                    <h4>${p.name}</h4>
                    <p>${p.desc || 'لا يوجد وصف مضاف'}</p>
                    <div class="product-price">${p.price}</div>
                    ${statusBadge}
                </div>
            `;
            grid.appendChild(card);
        });
    }

    function renderAdminProductsList() {
        const listContainer = document.getElementById('adminProductsList');
        listContainer.innerHTML = '';

        if(products.length === 0) {
            listContainer.innerHTML = '<div style="color: var(--text-muted); text-align: center; font-size: 0.85rem; padding: 10px;">لا توجد منتجات للحذف حالياً</div>';
            return;
        }

        products.forEach(p
